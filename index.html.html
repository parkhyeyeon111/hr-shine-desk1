const INS_LS_PREFIX="hr_shine_4ins_";
const INS_REASONS=["전월반영","차월반영","중도퇴사정산","직접입력"];
const INS_TYPES=["건강보험","국민연금"];

function fmtNum(v){if(v===null||v===undefined||v==="")return 0;const n=Number(String(v).replace(/,/g,"").replace(/\s/g,"").trim());return isNaN(n)?0:n;}
function fmtKRW(v){return Number(v||0).toLocaleString("ko-KR");}
function maskRRN(v){
  const s=String(v||"").replace(/-/g,"").replace(/\s/g,"");
  if(s.length>=13)return s.slice(0,6)+"-"+s[6]+"******";
  if(s.length>=7)return s.slice(0,6)+"-"+"*".repeat(s.length-6);
  return v;
}
function getInsKey(ym){return INS_LS_PREFIX+ym;}
function loadInsData(ym){const d=SheetDB.getIns(ym);return d||null;}
function saveInsData(ym,data){SheetDB.setCollection("ins:"+ym,data);}
function deleteInsData(ym){SheetDB.setCollection("ins:"+ym,null);}

function detectInsType(data){
  // Robust detection: scan more rows, check both signature columns
  // Health uses: G(6)=name, AM(38)=health amount
  // Pension uses: C(2)=name, S(18)=pension amount
  // Also check header text (row 0) first as most reliable signal
  const h0=String((data[0]||[]).join("|"));
  if(/국민연금|연금보험/.test(h0))return "국민연금";
  if(/건강보험|요양보험/.test(h0))return "건강보험";
  // Scan data rows (skip row 0 header)
  let healthScore=0, pensionScore=0;
  for(let i=1;i<Math.min(10,data.length);i++){
    const r=data[i]||[];
    if(fmtNum(r[38])>1000)healthScore+=2;   // AM col: health insurance
    if(fmtNum(r[18])>1000)pensionScore+=2;  // S col: pension
    if(fmtNum(r[6])===0&&fmtNum(r[2])>0)pensionScore++;  // G empty, C has name
    if(String(r[6]||"").trim().length>0)healthScore++;    // G has name → health
  }
  return pensionScore>healthScore?"국민연금":"건강보험";
}

function parsePubHealth(data){
  // Skip row 0 (header). Accumulate amounts for duplicate RRNs within the same file.
  const rrnMap={};
  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r||!r[6]||String(r[6]).trim()==="")continue;
    const key=String(r[7]||"").trim().replace(/-/g,"")||"_"+String(r[6]).trim()+i;
    if(rrnMap[key]){
      // Accumulate: same person appears multiple times → sum all amounts
      rrnMap[key].health    +=fmtNum(r[38]);
      rrnMap[key].care      +=fmtNum(r[39]);
      rrnMap[key].healthAdj +=fmtNum(r[40])+fmtNum(r[42]);
      rrnMap[key].careAdj   +=fmtNum(r[41])+fmtNum(r[43]);
    }else{
      rrnMap[key]={
        yearMonth:String(r[0]||"").trim(),name:String(r[6]||"").trim(),
        rrn:String(r[7]||"").trim(),dept:String(r[8]||"").trim(),empId:String(r[9]||"").trim(),
        health:fmtNum(r[38]),care:fmtNum(r[39]),
        healthAdj:fmtNum(r[40])+fmtNum(r[42]),careAdj:fmtNum(r[41])+fmtNum(r[43]),
        pension:0,insType:"건강보험",
      };
    }
  }
  return Object.values(rrnMap);
}

function parsePubPension(data){
  // Accumulate pension amounts for duplicate RRNs within the same file.
  const rrnMap={};
  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r||!r[2]||String(r[2]).trim()==="")continue;
    const key=String(r[3]||"").trim().replace(/-/g,"")||"_"+String(r[2]).trim()+i;
    if(rrnMap[key]){
      rrnMap[key].pension+=fmtNum(r[18]);
    }else{
      rrnMap[key]={
        yearMonth:String(r[0]||"").trim(),name:String(r[2]||"").trim(),
        rrn:String(r[3]||"").trim(),dept:String(r[4]||"").trim(),empId:String(r[5]||"").trim(),
        health:0,care:0,healthAdj:0,careAdj:0,
        pension:fmtNum(r[18]),insType:"국민연금",
      };
    }
  }
  return Object.values(rrnMap);
}

function parsePay(data){
  const rows=[];
  for(let i=1;i<data.length;i++){
    const r=data[i];
    if(!r||!r[2]||String(r[2]).trim()==="")continue;
    rows.push({
      yearMonth:String(r[0]||"").trim(),empId:String(r[1]||"").trim(),
      name:String(r[2]||"").trim(),rrn:String(r[3]||"").trim(),dept:String(r[10]||"").trim(),
      pension:fmtNum(r[4])+fmtNum(r[5]),  // E(연금)+F(연금정산) 합산
      health:fmtNum(r[6]),care:fmtNum(r[8]),
      healthAdj:fmtNum(r[7]),careAdj:fmtNum(r[9]),
    });
  }
  return rows;
}

function mergeData(pubRows,payRows){
  const payMap={};
  payRows.forEach(r=>{const k=String(r.rrn).replace(/-/g,"").replace(/\s/g,"");if(k)payMap[k]=r});
  const rows=pubRows.map(pub=>{
    const k=String(pub.rrn).replace(/-/g,"").replace(/\s/g,"");
    const pay=payMap[k]||null;
    const diffHealth=pub.health-(pay?pay.health:0);
    const diffCare=pub.care-(pay?pay.care:0);
    const diffHealthAdj=pub.healthAdj-(pay?pay.healthAdj:0);
    const diffCareAdj=pub.careAdj-(pay?pay.careAdj:0);
    const diffPension=pub.pension-(pay?pay.pension:0);
    const mismatch=diffHealth!==0||diffCare!==0||diffHealthAdj!==0||diffCareAdj!==0||diffPension!==0;
    return{...pub,pay,diffHealth,diffCare,diffHealthAdj,diffCareAdj,diffPension,mismatch,autoOk:!mismatch,id:k||pub.name+pub.empId};
  });
  // Mismatch first, then normal (both sorted by name within group)
  rows.sort((a,b)=>{
    if(b.mismatch!==a.mismatch)return(b.mismatch?1:0)-(a.mismatch?1:0);
    return(a.name||"").localeCompare(b.name||"","ko");
  });
  return rows;
}

function Page4Insurance({cloudRev}){
  const nowYM=()=>{const d=new Date();return d.getFullYear()+"."+(String(d.getMonth()+1).padStart(2,"0"))};
  const[curYM,setCurYM]=useState(nowYM);
  const[pubTypeOverride,setPubTypeOverride]=useState("auto");
  const[merged,setMerged]=useState([]);
  const[hasData,setHasData]=useState(false);
  const[reasons,setReasons]=useState({});
  const[customReasons,setCustomReasons]=useState({});
  const[checked,setChecked]=useState({});
  const[loading,setLoading]=useState("");
  const[error,setError]=useState("");
  const[deptView,setDeptView]=useState("전체");
  const[deptDeleteSel,setDeptDeleteSel]=useState("");
  const[rawPub,setRawPub]=useState([]);
  const[rawPay,setRawPay]=useState([]);
  const isLoadingRef=useRef(false); // blocks save during month-switch load
  const[driveFiles,setDriveFiles]=useState([]);
  const[driveUploading,setDriveUploading]=useState(false);
  const[driveStatus,setDriveStatus]=useState(""); // "", "uploading", "done", "err"
  const[showDrivePanel,setShowDrivePanel]=useState(false);

  // Navigate months
  function shiftMonth(dir){
    const[y,m]=curYM.split(".").map(Number);
    let nm=m+dir;let ny=y;
    if(nm>12){nm=1;ny++;}else if(nm<1){nm=12;ny--;}
    setCurYM(ny+"."+(String(nm).padStart(2,"0")));
  }

  // 한 달치 데이터를 캐시에서 읽어 화면 상태에 반영 (월 전환/클라우드 갱신 공용)
  function applyMonthData(ym){
    isLoadingRef.current=true;  // lock: prevent save firing with old/stale data
    const saved=loadInsData(ym);
    if(saved){
      const pub=saved.pub||[];const pay=saved.pay||[];
      const m=mergeData(pub,pay);
      const savedChecked=saved.checked||{};
      const autoChecked={...savedChecked};
      m.forEach(r=>{if(r.autoOk)autoChecked[r.id]=true;});
      setRawPub(pub);setRawPay(pay);
      setReasons(saved.reasons||{});setCustomReasons(saved.custom||{});
      setChecked(autoChecked);setMerged(m);setHasData(true);
    }else{
      setRawPub([]);setRawPay([]);
      setReasons({});setCustomReasons({});setChecked({});
      setMerged([]);setHasData(false);
    }
    setError("");
    setTimeout(()=>{isLoadingRef.current=false;},0);
  }

  // Load when curYM changes (월 전환)
  useEffect(()=>{
    applyMonthData(curYM);
    // Refresh Drive file list for new month (best-effort)
    setDriveFiles([]);
    driveFetchFileList(curYM).then(files=>setDriveFiles(files)).catch(()=>{});
  },[curYM]);

  // 다른 사용자가 바꾼 4대보험 데이터를 제자리 갱신 (cloudRev 신호 — 30초 주기/포커스/수동)
  // 내 저장 진행 중에는 syncFromCloud 가 막아주므로 작업 중 데이터가 덮어써지지 않음
  useSkipFirstEffect(()=>{
    const fresh=loadInsData(curYM);
    const norm=o=>JSON.stringify({pub:(o&&o.pub)||[],pay:(o&&o.pay)||[],reasons:(o&&o.reasons)||{},custom:(o&&o.custom)||{},checked:(o&&o.checked)||{}});
    const freshKey=fresh?norm(fresh):"none";
    const curKey=(rawPub.length||rawPay.length)?norm({pub:rawPub,pay:rawPay,reasons,custom:customReasons,checked}):"none";
    if(freshKey!==curKey)applyMonthData(curYM);
  },[cloudRev]);

  // Auto-check zero-diff rows; save whenever data/reasons/checked change
  useEffect(()=>{
    if(merged.length>0){
      // Auto-complete any newly calculated zero-diff rows
      setChecked(prev=>{
        let changed=false;const next={...prev};
        merged.forEach(r=>{if(r.autoOk&&!next[r.id]){next[r.id]=true;changed=true;}});
        return changed?next:prev;
      });
    }
  },[merged]);
  useSkipFirstEffect(()=>{
    // Skip saving while a month-switch load is in progress (prevents cross-month pollution)
    if(isLoadingRef.current)return;
    if(rawPub.length>0||rawPay.length>0){
      saveInsData(curYM,{pub:rawPub,pay:rawPay,reasons,custom:customReasons,checked});
    }
  },[rawPub,rawPay,reasons,customReasons,checked,curYM]);

  function readExcel(file,cb){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        cb(data);
      }catch(ex){setError("파일 읽기 실패: "+ex.message);setLoading("");}
    };
    reader.readAsArrayBuffer(file);
  }

  function handlePub(e){
    const f=e.target.files[0];if(!f)return;
    setLoading("공단 고지서 처리 중...");setError("");
    readExcel(f,data=>{
      // Strict mode: user selection overrides auto-detect completely
      const insType=pubTypeOverride==="auto"?detectInsType(data):pubTypeOverride;
      const newRows=insType==="국민연금"?parsePubPension(data):parsePubHealth(data);
      // Accumulate by RRN — different depts uploaded separately all survive
      setRawPub(prev=>{
        const rrnMap={};
        // Preserve all existing rows first (all depts)
        prev.forEach(r=>{
          const k=String(r.rrn).replace(/-/g,"").replace(/\s/g,"");
          rrnMap[k||"_"+r.name+r.empId]={...r};
        });
        // Merge new rows: only overwrite fields of the same insurance type
        newRows.forEach(r=>{
          const k=String(r.rrn).replace(/-/g,"").replace(/\s/g,"");
          const key=k||"_"+r.name+r.empId;
          if(rrnMap[key]){
            const existing=rrnMap[key];
            if(insType==="국민연금"){
              // Keep health fields from existing, update pension
              rrnMap[key]={...existing,pension:r.pension,
                insType:existing.insType==="건강보험"?"건강+연금":"국민연금"};
            }else{
              // Keep pension from existing, update health fields
              rrnMap[key]={...existing,health:r.health,care:r.care,
                healthAdj:r.healthAdj,careAdj:r.careAdj,
                name:r.name,dept:r.dept,empId:r.empId,yearMonth:r.yearMonth,
                insType:existing.insType==="국민연금"?"건강+연금":"건강보험"};
            }
          }else{
            rrnMap[key]={...r};
          }
        });
        const next=Object.values(rrnMap);
        const m=mergeData(next,rawPay);setMerged(m);setHasData(true);setLoading("");
        return next;
      });
    });
   
    // Fire-and-forget Drive upload
    if(GAS_DRIVE_URL&&GAS_DRIVE_URL!=="여기에_GAS_배포_URL_입력"){setDriveUploading(true);setDriveStatus("uploading");driveUploadFile(f,curYM).then(()=>{setDriveStatus("done");driveFetchFileList(curYM).then(setDriveFiles);}).catch(()=>setDriveStatus("err")).finally(()=>setDriveUploading(false));}
    e.target.value="";
  }
  function handlePay(e){
    const f=e.target.files[0];if(!f)return;
    setLoading("급여대장 처리 중...");setError("");
    readExcel(f,data=>{
      // parsePay reads G(건강)+I(요양)+H(건강정산)+J(요양정산)+E(연금) all at once
      // Accumulate pay by RRN same as pub — multiple depts survive
      const newPayRows=parsePay(data);
      setRawPay(prev=>{
        const rrnMap={};
        prev.forEach(r=>{const k=String(r.rrn).replace(/-/g,"").replace(/\s/g,"");rrnMap[k||"_"+r.name]=r;});
        newPayRows.forEach(r=>{
          const k=String(r.rrn).replace(/-/g,"").replace(/\s/g,"");
          // Overwrite entire row for this RRN (pay file is source of truth for all pay columns)
          rrnMap[k||"_"+r.name]={...r};
        });
        const next=Object.values(rrnMap);
        const m=mergeData(rawPub,next);setMerged(m);setHasData(true);setLoading("");
        return next;
      });
    });
    // Fire-and-forget Drive upload
    if(GAS_DRIVE_URL&&GAS_DRIVE_URL!=="여기에_GAS_배포_URL_입력"){setDriveUploading(true);setDriveStatus("uploading");driveUploadFile(f,curYM).then(()=>{setDriveStatus("done");driveFetchFileList(curYM).then(setDriveFiles);}).catch(()=>setDriveStatus("err")).finally(()=>setDriveUploading(false));}
    e.target.value="";
  }

  function handleDelete(){
    if(!confirm(curYM+" 데이터를 모두 삭제할까요?"))return;
    deleteInsData(curYM);
    setRawPub([]);setRawPay([]);setReasons({});setCustomReasons({});setChecked({});setMerged([]);setHasData(false);
  }

  // Delete only rows matching a specific dept from current month
  function handleDeptDelete(){
    if(!deptDeleteSel){alert("삭제할 사업부를 선택해주세요.");return;}
    if(!confirm(curYM+" 데이터에서 "+deptDeleteSel+" 사업부를 삭제할까요?"))return;
    const nextPub=rawPub.filter(r=>(r.dept||"미분류")!==deptDeleteSel);
    const nextPay=rawPay.filter(r=>(r.dept||"미분류")!==deptDeleteSel);
    setRawPub(nextPub);setRawPay(nextPay);
    const m=mergeData(nextPub,nextPay);setMerged(m);
    if(nextPub.length===0&&nextPay.length===0){deleteInsData(curYM);setHasData(false);}
    setDeptDeleteSel("");
  }

  // Download sample Excel templates using SheetJS

      headers=["A고지년월","...","...","...","...","...","G이름","H주민번호","I사업부","J사번",
        "...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...","...",
        "AM건강보험","AN요양보험","AO건강정산1","AP요양정산1","AQ건강정산2","AR요양정산2"];
      sampleRow=["2025.05","","","","","","홍길동","900101-1234567","PA","EMP001",

        "...","...","...","...","...","...","...","...","...","...","...","...",
        "S국민연금"];
      sampleRow=["2025.05","","홍길동","900101-1234567","PA","EMP001",
        "","","","","","","","","","","","",95000];
      sheetName="국민연금 고지서";
    }else{
      headers=["A고지년월","B사번","C이름","D주민번호","E국민연금(예수금)","F국민연금정산","G건강보험(예수금)","H건강정산","I요양보험(예수금)","J요양정산","K사업부"];
      sampleRow=["2025.05","EMP001","홍길동","900101-1234567",95000,2000,100000,0,8500,0,"PA"];
      sheetName="급여대장";
    }
    const ws=XLSX.utils.aoa_to_sheet([headers,sampleRow]);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheetName);
    XLSX.writeFile(wb,sheetName+"_샘플양식.xlsx");

  function downloadUploadedHealthGovExcel(){
    const healthRows=rawPub.filter(r=>r.insType==="건강보험"||r.insType==="건강+연금"||(r.health>0||r.care>0||r.healthAdj>0||r.careAdj>0));
    if(healthRows.length===0){alert("해당 월("+curYM+")에 업로드된 건강보험 고지서 데이터가 없습니다.");return;}
    // Reconstruct with original column positions (sparse array, 44 cols: A=0..AR=43)
    // A(0):고지년월, G(6):이름, H(7):주민번호, I(8):사업부, J(9):사번
    // AM(38):건강, AN(39):요양, AO(40):건강정산(절반→AO), AQ(42):건강정산(나머지→AQ)
    // AP(41):요양정산(절반→AP), AR(43):요양정산(나머지→AR)
    const hdr=["A고지년월","","","","","","G이름","H주민번호","I사업부","J사번",
      "","","","","","","","","","","","","","","","","","","","","","","","","","","","","",
      "AM건강보험","AN요양보험","AO건강정산","AP요양정산","AQ건강정산2","AR요양정산2"];
    const rows=[hdr];
    healthRows.forEach(r=>{
      const row=Array(44).fill("");
      row[0]=r.yearMonth;row[6]=r.name;row[7]=r.rrn;row[8]=r.dept;row[9]=r.empId;
      row[38]=r.health;row[39]=r.care;
      // Split adj back: store full value in AO/AP, leave AQ/AR as 0
      row[40]=r.healthAdj;row[41]=r.careAdj;row[42]=0;row[43]=0;
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"건강보험 고지서");
    XLSX.writeFile(wb,"업로드원본_건강보험_고지서_"+curYM+".xlsx");
  }

  function downloadUploadedPensionGovExcel(){
    const pensionRows=rawPub.filter(r=>r.insType==="국민연금"||r.insType==="건강+연금"||(r.pension>0));
    if(pensionRows.length===0){alert("해당 월("+curYM+")에 업로드된 국민연금 고지서 데이터가 없습니다.");return;}
    // A(0):고지년월, C(2):이름, D(3):주민번호, E(4):사업부, F(5):사번, S(18):국민연금
    const hdr=["A고지년월","","C이름","D주민번호","E사업부","F사번",
      "","","","","","","","","","","","","S국민연금"];
    const rows=[hdr];
    pensionRows.forEach(r=>{
      const row=Array(19).fill("");
      row[0]=r.yearMonth;row[2]=r.name;row[3]=r.rrn;row[4]=r.dept;row[5]=r.empId;
      row[18]=r.pension;
      rows.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"국민연금 고지서");
    XLSX.writeFile(wb,"업로드원본_국민연금_고지서_"+curYM+".xlsx");
  }

  function setReason(id,v){
    setReasons(p=>({...p,[id]:v}));
    // Auto-mark as checked when a reason is selected (not empty)
    if(v)setChecked(p=>({...p,[id]:true}));
  }
  function setCustom(id,v){
    setCustomReasons(p=>({...p,[id]:v}));
    // Auto-mark done when custom text is entered
    if(v.trim())setChecked(p=>({...p,[id]:true}));
  }
  function toggleCheck(id){setChecked(p=>({...p,[id]:!p[id]}))}

  // Dept summary
  const depts=useMemo(()=>["전체",...new Set(merged.map(r=>r.dept||"미분류"))]  ,[merged]);
  const viewRows=useMemo(()=>deptView==="전체"?merged:merged.filter(r=>(r.dept||"미분류")===deptView),[merged,deptView]);
  const deptSummary=useMemo(()=>{
    const map={};
    merged.forEach(r=>{
      const d=r.dept||"미분류";
      if(!map[d])map[d]={dept:d,pubH:0,pubC:0,pubHA:0,pubCA:0,pubP:0,payH:0,payC:0,payHA:0,payCA:0,payP:0};
      map[d].pubH+=r.health;map[d].pubC+=r.care;map[d].pubHA+=r.healthAdj;map[d].pubCA+=r.careAdj;map[d].pubP+=r.pension;
      if(r.pay){map[d].payH+=r.pay.health;map[d].payC+=r.pay.care;map[d].payHA+=r.pay.healthAdj;map[d].payCA+=r.pay.careAdj;map[d].payP+=r.pay.pension;}
    });
    return Object.values(map).sort((a,b)=>a.dept.localeCompare(b.dept,"ko"));
  },[merged]);

  const mismatchCount=merged.filter(r=>r.mismatch&&!checked[r.id]).length;
  const doneCount=merged.filter(r=>checked[r.id]).length;

  const TH=(bg)=>({background:bg||"var(--sky-d)",padding:"7px 8px",fontSize:9.5,fontWeight:700,color:"#fff",whiteSpace:"nowrap",textAlign:"center",borderRight:"1px solid rgba(255,255,255,.15)"});
  const TD_DIFF=(v)=>{const n=Number(v||0);return <td style={{fontFamily:"'DM Mono',monospace",fontWeight:700,textAlign:"right",padding:"7px 8px",borderBottom:"1px solid #E8EEF5",color:n>0?"#DC2626":n<0?"#7C3AED":"#94A3B8",background:n!==0?"rgba(220,38,38,.04)":undefined,whiteSpace:"nowrap"}}>{n>0?"+":""}{fmtKRW(n)}</td>;};
  const TD_AMT=(v,clr)=><td style={{fontFamily:"'DM Mono',monospace",fontSize:11,fontWeight:600,textAlign:"right",padding:"7px 8px",borderBottom:"1px solid #E8EEF5",color:clr||"var(--sky-d)",whiteSpace:"nowrap"}}>{fmtKRW(v)}</td>;

  const hasHealth=merged.some(r=>r.insType==="건강보험"||r.health>0||r.care>0);
  const hasPension=merged.some(r=>r.insType==="국민연금"||r.pension>0);

  function downloadVerificationExcel(){
    const dept=deptView==="전체"?"전체":deptView;
    const rows=viewRows;
    const hasH=rows.some(r=>r.insType==="건강보험"||r.health>0||r.care>0);
    const hasP=rows.some(r=>r.insType==="국민연금"||r.pension>0);
    const headers=["사업부","이름","주민번호(앞6자리)","고지년월"];
    if(hasH)headers.push("공단_건강","공단_요양","공단_건강정산","공단_요양정산","급여_건강","급여_요양","급여_건강정산","급여_요양정산","차액_건강","차액_요양","차액_건강정산","차액_요양정산");
    if(hasP)headers.push("공단_연금","급여_연금","차액_연금");
    headers.push("사유","직접입력사유","검토상태");
    const data=[headers];
    rows.forEach(r=>{
      const rrn6=String(r.rrn||"").replace(/-/g,"").slice(0,6)+"*******";
      const row=[r.dept||"",r.name||"",rrn6,r.yearMonth||""];
      if(hasH)row.push(r.health||0,r.care||0,r.healthAdj||0,r.careAdj||0,r.pay?r.pay.health:0,r.pay?r.pay.care:0,r.pay?r.pay.healthAdj:0,r.pay?r.pay.careAdj:0,r.diffHealth||0,r.diffCare||0,r.diffHealthAdj||0,r.diffCareAdj||0);
      if(hasP)row.push(r.pension||0,r.pay?r.pay.pension:0,r.diffPension||0);
      row.push(reasons[r.id]||"",customReasons[r.id]||"",checked[r.id]?"검토완료":r.autoOk?"자동완료":"검토대기");
      data.push(row);
    });
    const ws=XLSX.utils.aoa_to_sheet(data);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"상세비교");
    const today=new Date();const ds=today.getFullYear()+String(today.getMonth()+1).padStart(2,"0")+String(today.getDate()).padStart(2,"0");
    XLSX.writeFile(wb,"4대보험_검증_상세비교_"+dept+"_"+curYM+".xlsx");
  }

    {/* Month navigator */}
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,background:"#fff",border:"1px solid var(--border2)",borderRadius:"var(--r)",padding:"12px 18px",boxShadow:"var(--sh)"}}>

// ── Dashboard (메인 대시보드) ────────────────────────────────────────────────────
function Dashboard(){
  const saved=lsGet();
  if(saved){delete saved.selectedDate;delete saved.calYear;delete saved.calMonth;}
  const[page,setPage]=useState("home");
  const[team,setTeam]=useState(()=>(saved&&saved.team)||DEF_TEAM);
  const[employees,setEmployees]=useState(()=>(saved&&saved.employees)||[]);
  const[tasks,setTasks]=useState(()=>(saved&&saved.tasks)||[]);
  const[ts,setTs]=useState(()=>(saved&&saved.ts)||{});
  const[routines,setRoutines]=useState(()=>loadRoutines()||[]);
  const[calYear,setCalYear]=useState(()=>new Date().getFullYear());
  const[calMonth,setCalMonth]=useState(()=>new Date().getMonth());
  const[selectedDate,setSelectedDate]=useState(()=>todayStr);
  const[modal,setModal]=useState(null);
  const[adminName,setAdminName]=useState(()=>(saved&&saved.adminName)||"박혜연");
  const[toast,setToast]=useState(null);
  const[empForm,setEmpForm]=useState({name:"",empId:"",dept:"HQ",type:"입사",date:todayStr,note:""});
  const[apiRows,setApiRows]=useState([]);
  const[apiStatus,setApiStatus]=useState("idle");
  const[apiUrl,setApiUrl]=useState(API_URL);
  const[gTmpl,setGTmpl]=useState(()=>loadGTmpl());
  const[showGuide,setShowGuide]=useState(false);
  const[cloudRev,setCloudRev]=useState(0); // 다른 사용자 변경분을 당겨올 때 하위 페이지 강제 새로고침용

  // ── 컬렉션별 클라우드 저장 (변경 시 → 구글 시트로 push, optimistic) ──
  useSkipFirstEffect(()=>{SheetDB.setCollection("team",team)},[team]);
  useSkipFirstEffect(()=>{SheetDB.setCollection("employees",employees)},[employees]);
  useSkipFirstEffect(()=>{SheetDB.setCollection("tasks",tasks)},[tasks]);
  useSkipFirstEffect(()=>{SheetDB.setCollection("ts",ts)},[ts]);
  useSkipFirstEffect(()=>{SheetDB.setCollection("adminName",adminName)},[adminName]);
  useSkipFirstEffect(()=>{saveRoutines(routines)},[routines]);

  // ── 다른 사용자의 변경분 동기화: 창 포커스 / 30초 주기 / 수동 버튼 ──
  const reconcile=useCallback((data)=>{
    if(!data)return;
    const setIfDiff=(cur,next,setter)=>{ if(next!==undefined&&JSON.stringify(cur)!==JSON.stringify(next))setter(next); };
    setIfDiff(team,data.team,setTeam);
    setIfDiff(employees,data.employees,setEmployees);
    setIfDiff(tasks,data.tasks,setTasks);
    setIfDiff(ts,data.ts,setTs);
    setIfDiff(routines,data.routines,setRoutines);
    if(data.gTmpl&&typeof data.gTmpl==="object")setIfDiff(gTmpl,data.gTmpl,setGTmpl);
    if(typeof data.adminName==="string"&&data.adminName)setIfDiff(adminName,data.adminName,setAdminName);
    setCloudRev(v=>v+1); // 메모/4대보험/체크리스트는 cloudRev 신호로 "제자리 갱신"(remount 아님) → 30초 주기에도 실시간 반영
  },[team,employees,tasks,ts,routines,gTmpl,adminName]);
  const syncFromCloud=useCallback(async()=>{
    if(SheetDB.pending()>0)return; // 내 저장이 진행 중이면 건너뜀(덮어쓰기 방지)
    const data=await SheetDB.refresh();
    reconcile(data);
  },[reconcile]);
  useEffect(()=>{
    const onFocus=()=>syncFromCloud();
    window.addEventListener("focus",onFocus);
    const iv=setInterval(()=>syncFromCloud(),30000);
    return()=>{window.removeEventListener("focus",onFocus);clearInterval(iv)};
  },[syncFromCloud]);

  useEffect(()=>{
    if(!routines||routines.length===0)return;
    setTasks(prev=>{
      let next=[...prev];let changed=false;
      (routines||[]).forEach(r=>{const ne=expandRoutine(r,next,team);if(ne.length>0){next=[...next,...ne];changed=true;}});
      return changed?next:prev;
    });
  },[routines,team]);

  useEffect(()=>{
    setTs(prev=>{let ch=false;const n={...prev};(tasks||[]).forEach(t=>{if(n[t.id]===undefined){n[t.id]="pending";ch=true;}});return ch?n:prev});
  },[tasks]);

  const onToggle=useCallback(id=>setTs(p=>({...p,[id]:p[id]==="completed"?"pending":"completed"})),[]);
  // Expose addTask globally so QuickAddModal can call it without prop-drilling
  useEffect(()=>{
    window.__addTask=(newTask)=>{
      setTasks(p=>[...p,newTask]);
      setTs(p=>({...p,[newTask.id]:"pending"}));
    };
    return()=>{delete window.__addTask};
  },[]);
  const onDelete=useCallback(id=>{setTasks(p=>p.filter(t=>t.id!==id));setTs(p=>{const s={...p};delete s[id];return s})},[]);
  const onEditTask=useCallback((id,patch)=>{setTasks(p=>(p||[]).map(t=>t.id===id?{...t,...patch}:t))},[]);
  const onCalNav=dir=>setCalMonth(m=>{let nm=m+dir;if(nm>11){setCalYear(y=>y+1);return 0}if(nm<0){setCalYear(y=>y-1);return 11}return nm});
  const onAddCal=date=>{setSelectedDate(date);setModal("schedule")};

  function handleAddSchedules(payload){
    if(!payload)return;
    if(payload.kind==="tasks"){
      const tks=payload.tasks||[];setTasks(p=>[...p,...tks]);setTs(p=>{const s={...p};tks.forEach(t=>s[t.id]="pending");return s});setToast("일정 "+tks.length+"개 추가 완료");
    }else if(payload.kind==="routine"){
      const nr={id:uid(),task:payload.task,cycle:payload.cycle,startDate:payload.startDate,day:payload.day,legal:payload.legal,assignees:payload.assignees};
      const newRts=[...(routines||[]),nr];setRoutines(newRts);
      const ne=expandRoutine(nr,[...(tasks||[])],team||[]);
      setTasks(p=>[...p,...ne]);setTs(p=>{const s={...p};ne.forEach(t=>s[t.id]="pending");return s});
      setToast("정기 일정 생성 완료 ("+ne.length+"개 일정 생성)");
    }
  }
  function handleDeleteRoutine(rid){
    setRoutines(p=>(p||[]).filter(r=>r.id!==rid));
    setTasks(p=>(p||[]).filter(t=>t.routineId!==rid));
    setTs(p=>{const s={...p};(tasks||[]).forEach(t=>{if(t.routineId===rid)delete s[t.id]});return s});
    setToast("정기 일정 삭제 완료");
  }
  function handleEditRoutine(rid,payload){
    const updated={id:rid,...payload};
    setRoutines(p=>(p||[]).map(r=>r.id===rid?updated:r));
    setTasks(prev=>{
      const without=(prev||[]).filter(t=>t.routineId!==rid);
      const ne=expandRoutine(updated,without,team||[]);
      return [...without,...ne];
    });
    setToast("정기 일정 수정 완료");
  }
  function handleRefresh(){setApiStatus("loading");fetch(apiUrl).then(r=>r.json()).then(data=>{const rows=Array.isArray(data)?data:(data.data||[]);setApiRows(rows.map((r,i)=>({rowIndex:r.rowIndex||(i+2),...r})));setApiStatus("ok")}).catch(()=>setApiStatus("err"))}
  function submitEmp(){
    if(!empForm.name||!empForm.date)return alert("이름과 날짜를 입력해주세요.");
    const emp={id:uid(),...empForm,empId:empForm.empId||"N/A"};
    setEmployees(p=>[...(p||[]),emp]);const nt=genEmpTasks(emp);
    setTasks(p=>[...(p||[]),...nt]);setTs(p=>{const s={...p};nt.forEach(t=>s[t.id]="pending");return s});
    setModal(null);setEmpForm({name:"",empId:"",dept:"HQ",type:"입사",date:todayStr,note:""});setToast(empForm.name+" 추가 완료");
  }

  const urgentCount=(tasks||[]).filter(t=>t.urgent&&ts[t.id]!=="completed").length;
  const moveCount=(apiRows||[]).filter(r=>MOVE_TYPES.includes(String(r.isReflected||"").trim())).length;
  const histPend=(apiRows||[]).filter(r=>r.verify1Done&&!r.verify2Done).length;
  const NAV=[{key:"home",label:"전체 워크플로우",icon:"⊞"},{key:"ob",label:"인사이동 관리",icon:"↔",badge:moveCount,bCls:"sky"},{key:"team",label:"팀원별 진척도",icon:"◈"},{key:"history",label:"업무 이력",icon:"≡",badge:histPend},{key:"memo",label:"특이사항 관리",icon:"✎"},{key:"insurance",label:"4대보험 검증",icon:"◉"}];
  const PMETA={home:{title:"HRM 업무 관리 대시보드",sub:KOR_M[calMonth]+" "+calYear+" · 일정 관리"},ob:{title:"인사이동 관리",sub:"D열 자동 필터링 · 공통 루틴 체크리스트"},team:{title:"팀원별 진척도",sub:"당일 진행률 · "+selectedDate+" 기준"},history:{title:"업무 이력",sub:"Google Sheets 연동 · 1차/2차 검증"},memo:{title:"특이사항 관리",sub:"HR 메모 · 이슈 · 요청사항 기록 및 관리"},insurance:{title:"4대보험 검증",sub:"공단 고지서 vs 급여대장 주민번호 기준 자동 매칭 · 차액 계산"}};

  return <div className="bw">
    <div className="bchrome">
      <div className="btb">
        <div className="bdots"><div className="bd r"/><div className="bd y"/><div className="bd g"/></div>
        <div className="baddr" style={{flex:1}}><span>{"hr-shine-desk.app / "+page}</span><div style={{flex:1}}/><span style={{fontSize:10,color:"#94A3B8"}}>HR SHINE DESK v15</span></div>
        <div style={{display:"flex",gap:10,alignItems:"center",fontSize:10,color:"#64748B"}}><SyncBadge/></div>
      </div>
      <div className="btabs"><div className="btab active">HR SHINE DESK — {(PMETA[page]||{}).title}</div></div>
    </div>
    <div className="bcontent">
      <div className="shell">
        <aside className="sidebar">
          <div className="sb-logo">
            <div className="sb-logo-icon"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="white"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".7"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".7"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".4"/></svg></div>
            <div className="sb-logo-t">HR SHINE DESK</div>
            <div className="sb-logo-s">HRM Operations v15</div>
          </div>
          <div className="sb-sec">워크스페이스</div>
          <nav className="sb-nav">
            {NAV.map(({key,label,icon,badge,bCls})=><button key={key} className={"nav-item"+(page===key?" active":"")} onClick={()=>setPage(key)}>
              <span style={{opacity:.8}}>{icon}</span><span style={{flex:1}}>{label}</span>
              {badge>0&&<span className={"nav-badge"+(bCls?" "+bCls:"")}>{badge}</span>}
            </button>)}
          </nav>
          <div className="sb-footer">
            <div style={{fontSize:10,color:"rgba(255,255,255,.35)",display:"flex",alignItems:"center",gap:5,marginBottom:5}}><div className="ldot"/>구글 시트 실시간 공유 저장</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,.2)",fontFamily:"'DM Mono',monospace"}}>{"정기 일정: "+(routines||[]).length+"개 활성"}</div>
          </div>
        </aside>
        <div className="main">
          <header className="topbar">
            <div>
              <div style={{fontSize:14,fontWeight:800,color:"var(--sky-deep)"}}>{(PMETA[page]||{}).title}</div>
              <div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>{(PMETA[page]||{}).sub}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <a href="https://docs.google.com/spreadsheets/d/1-gpzWbXGwPIOz6FIJwLGeAmcOVLK_JWtLeFLZ-DW8D4/edit?gid=0#gid=0" target="_blank" rel="noopener noreferrer" style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,padding:"5px 12px",borderRadius:"var(--rs)",border:"1px solid #BBF7D0",background:"#F0FDF4",color:"#16A34A",fontWeight:600,textDecoration:"none",cursor:"pointer"}}>
                <span style={{width:8,height:8,borderRadius:"50%",background:"#16A34A",display:"inline-block",flexShrink:0}}/>
                구글 시트 바로가기
              </a>
              <button className="btn btn-ghost" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>{syncFromCloud();handleRefresh();setToast("최신 데이터 동기화 중...")}}>↻ 동기화</button>
              <button className="btn btn-ghost" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>setModal("routine")}>정기 일정 관리</button>
              <button className="btn btn-ghost" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>setModal("schedule")}>+ 일정 추가</button>
              <button className="btn btn-primary" style={{fontSize:11,padding:"5px 14px"}} onClick={()=>setModal("employee")}>+ 직원 추가</button>
              <button className="btn btn-ghost" style={{fontSize:11,padding:"5px 12px"}} onClick={()=>setShowGuide(true)}>도움말</button>
              <div style={{width:30,height:30,borderRadius:"50%",background:"var(--sky-l)",border:"1.5px solid var(--sky-m)",color:"var(--sky-d)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800}}>HR</div>
            </div>
          </header>
          <main className="pgcont">
            {page==="home"&&<PageHome employees={employees||[]} tasks={tasks||[]} ts={ts||{}} apiRows={apiRows||[]} team={team||[]} calYear={calYear} calMonth={calMonth} onCalNav={onCalNav} onToggle={onToggle} onDelete={onDelete} onEditTask={onEditTask} onAddCal={onAddCal} selectedDate={selectedDate} onSelectDate={setSelectedDate}/>}
            {page==="ob"&&<PageOB apiRows={apiRows||[]} apiStatus={apiStatus} team={team||[]} onRefresh={handleRefresh} gTmpl={gTmpl} setGTmpl={setGTmpl}/>}
            {page==="team"&&<PageTeam tasks={tasks||[]} ts={ts||{}} team={team||[]} onToggle={onToggle} onDelete={onDelete} onEditTask={onEditTask} onUpdateTeam={setTeam} selectedDate={selectedDate} onSelectDate={setSelectedDate}/>}
            {page==="history"&&<PageHistory adminName={adminName} setAdminName={setAdminName} apiRows={apiRows||[]} setApiRows={setApiRows} apiStatus={apiStatus} setApiStatus={setApiStatus} apiUrl={apiUrl} setApiUrl={setApiUrl}/>}
            {page==="memo"&&<PageMemo cloudRev={cloudRev} selectedDate={selectedDate}/>}
            {page==="insurance"&&<Page4Insurance cloudRev={cloudRev}/>}
          </main>
        </div>
      </div>
    </div>
    {modal==="employee"&&<Modal title="직원 추가" sub="추가 즉시 일정이 자동 생성됩니다." onClose={()=>setModal(null)}>
      <FR label="이름"><input className="inp" placeholder="홍길동" value={empForm.name} onChange={e=>setEmpForm(f=>({...f,name:e.target.value}))}/></FR>
      <FR label="사번"><input className="inp" placeholder="EMP-001" value={empForm.empId} onChange={e=>setEmpForm(f=>({...f,empId:e.target.value}))}/></FR>
      <FR label="사업부"><select className="inp" value={empForm.dept} onChange={e=>setEmpForm(f=>({...f,dept:e.target.value}))}>{DEPTS.map(d=><option key={d}>{d}</option>)}</select></FR>
      <FR label="구분"><select className="inp" value={empForm.type} onChange={e=>setEmpForm(f=>({...f,type:e.target.value}))}>{ALL_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}</select></FR>
      <FR label="날짜"><input type="date" className="inp" value={empForm.date} onChange={e=>setEmpForm(f=>({...f,date:e.target.value}))}/></FR>
      <FR label="특이사항"><input className="inp" placeholder="권고사직, 계약만료 등" value={empForm.note} onChange={e=>setEmpForm(f=>({...f,note:e.target.value}))}/></FR>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
        <button className="btn btn-ghost" onClick={()=>setModal(null)}>취소</button>
        <button className="btn btn-primary" onClick={submitEmp}>추가 + 자동 생성</button>
      </div>
    </Modal>}
    {modal==="schedule"&&<ScheduleModal team={team||[]} onClose={()=>setModal(null)} onAddSchedules={handleAddSchedules}/>}
    {modal==="routine"&&<RoutineManagerModal routines={routines||[]} team={team||[]} onClose={()=>setModal(null)} onDelete={handleDeleteRoutine} onEdit={handleEditRoutine} onAdd={handleAddSchedules} onReset={()=>{setRoutines([]);setTasks(p=>(p||[]).filter(t=>!t.routineId));setToast("정기 일정 초기화 완료");setModal(null)}}/>}
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    {showGuide&&<GuideModal onClose={()=>setShowGuide(false)}/>}
  </div>;
}

// ── 상단 동기화 상태 배지 ─────────────────────────────────────────────────────
function SyncBadge(){
  const[st,setSt]=useState(SheetDB.status());
  useEffect(()=>SheetDB.onStatus(setSt),[]);
  const MAP={
    idle:{dot:"#94A3B8",t:"대기"},
    loading:{dot:"#0EA5E9",t:"불러오는 중…"},
    saving:{dot:"#0EA5E9",t:"저장 중…"},
    saved:{dot:"#16A34A",t:"동기화됨"},
    offline:{dot:"#D97706",t:"오프라인(로컬 저장)"},
    error:{dot:"#DC2626",t:"연결 오류"},
  };
  const m=MAP[st]||MAP.idle;
  const spin=(st==="saving"||st==="loading");
  return <span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:10,color:"#475569",fontWeight:600}}>
    <span style={{width:8,height:8,borderRadius:"50%",background:m.dot,display:"inline-block",
      boxShadow:spin?"0 0 0 3px "+m.dot+"22":"none",transition:"all .2s"}}/>
    {m.t}
  </span>;
}

// ── App — 부트 로더: 시트에서 전체 데이터 로드 후 대시보드 진입 ─────────────────
function App(){
  const[booted,setBooted]=useState(false);
  useEffect(()=>{SheetDB.boot().then(()=>setBooted(true)).catch(()=>setBooted(true))},[]);
  if(!booted){
    return <div style={{height:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
        background:"var(--bg)",fontFamily:"'Noto Sans KR',sans-serif"}}>
      <div style={{width:56,height:56,borderRadius:16,background:"linear-gradient(135deg,#0EA5E9,#38BDF8)",
        display:"flex",alignItems:"center",justifyContent:"center",marginBottom:18,
        boxShadow:"0 8px 28px rgba(14,165,233,.35)"}}>
        <svg width="28" height="28" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" fill="white"/><rect x="9" y="1" width="6" height="6" rx="1.5" fill="white" opacity=".7"/><rect x="1" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".7"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="white" opacity=".4"/></svg>
      </div>
      <div style={{fontSize:16,fontWeight:800,color:"var(--sky-deep)",letterSpacing:"-.02em"}}>HR SHINE DESK</div>
      <div style={{fontSize:12,color:"var(--t2)",marginTop:8,display:"flex",alignItems:"center",gap:8}}>
        <span className="boot-spin" style={{width:14,height:14,border:"2px solid var(--sky-m)",borderTopColor:"var(--sky)",borderRadius:"50%",display:"inline-block"}}/>
        구글 시트에서 공유 데이터를 불러오는 중…
      </div>
      <style>{"@keyframes bootspin{to{transform:rotate(360deg)}}.boot-spin{animation:bootspin .7s linear infinite}"}</style>
    </div>;
  }
  return <Dashboard/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
