<style>


*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--sky:#0EA5E9;--sky-l:#E0F2FE;--sky-m:#BAE6FD;--sky-d:#0284C7;--sky-deep:#0C4A6E;
--white:#fff;--bg:#F0F7FF;--s2:#F8FBFF;--border:#DBEAFE;--border2:#BFDBFE;

}
html,body{height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}

.bw{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#CBD5E1}
.bchrome{background:linear-gradient(180deg,#F1F5F9,#E2E8F0);border-bottom:1px solid #CBD5E1;padding:8px 12px 0;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btb{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bdots{display:flex;gap:5px}
.bd{width:11px;height:11px;border-radius:50%;cursor:pointer}
.bd.r{background:#FF5F57;border:.5px solid #E0443E}
.bd.y{background:#FEBC2E;border:.5px solid #D4A017}
.bd.g{background:#28C840;border:.5px solid #1DAD2B}
.btabs{display:flex;gap:2px}
.btab{display:flex;align-items:center;gap:7px;padding:6px 16px 7px;background:#fff;border:1px solid #CBD5E1;border-bottom:none;border-radius:8px 8px 0 0;font-size:11.5px;font-weight:500;color:var(--t2)}
.btab.active{color:var(--sky-d)}
.baddr{display:flex;align-items:center;gap:8px;padding:4px 8px;margin:0 60px 8px;background:#fff;border:1px solid #CBD5E1;border-radius:20px;font-size:11px;color:var(--t3)}
.bcontent{flex:1;overflow:hidden;background:var(--bg);border-top:2px solid #fff}
.shell{display:flex;height:100%;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--sky-deep);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--sky),#38BDF8);display:flex;align-items:center;justify-content:center;margin-bottom:10px;box-shadow:0 4px 12px rgba(14,165,233,.4)}
.sb-logo-t{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.02em}
.sb-logo-s{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.sb-sec{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:14px 18px 6px}
.sb-nav{padding:6px 10px;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.55);border:none;background:transparent;width:100%;text-align:left;font-family:inherit;transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(14,165,233,.3);color:#fff;font-weight:700;border-left:2px solid #38BDF8}
.nav-badge{margin-left:auto;font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;background:rgba(239,68,68,.85);color:#fff}

.card{background:#fff;border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#fff,#F8FBFF)}

.card-body{padding:16px 18px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--border2);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--sky-d),var(--sky))}
.stat-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

.bdg-blue{background:#EFF6FF;color:#1D4ED8;border-color:#BFDBFE}
.bdg-red{background:#FEF2F2;color:#DC2626;border-color:#FECACA}
.bdg-green{background:#F0FDF4;color:#16A34A;border-color:#BBF7D0}
.bdg-purple{background:#F5F3FF;color:#7C3AED;border-color:#DDD6FE}
.bdg-pink{background:#FDF2F8;color:#BE185D;border-color:#FBCFE8}
.bdg-amber{background:#FFFBEB;color:#D97706;border-color:#FDE68A}
.bdg-sky{background:var(--sky-l);color:var(--sky-d);border-color:var(--sky-m)}
.bdg-gray{background:#F8FAFC;color:#64748B;border-color:#E2E8F0}
.cal-cell{cursor:pointer;border-radius:8px;transition:all .1s;padding:5px;min-height:56px;display:flex;flex-direction:column;border:1px solid transparent}
.cal-cell:hover{background:var(--sky-l)}
.cal-cell.active{background:var(--sky)!important;color:#fff}
.cal-cell.today{background:var(--sky-l);border-color:var(--sky)}
.cal-cell.has-ev::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--sky);margin:2px auto 0}
.cal-cell.active.has-ev::after{background:#fff}
.xwrap{overflow:auto;border:1px solid #CBD5E1;border-radius:8px;max-height:480px}
.xtbl{border-collapse:collapse;width:100%;font-size:12px;min-width:900px}
.xtbl thead{position:sticky;top:0;z-index:2}
.xcl{background:linear-gradient(180deg,#E2E8F0,#CBD5E1);color:#64748B;font-size:10px;font-weight:700;text-align:center;padding:4px 6px;border-right:1px solid #CBD5E1;border-bottom:2px solid #CBD5E1;letter-spacing:.06em;white-space:nowrap;font-family:'DM Mono',monospace}
.xtbl tbody tr{transition:background .1s}
.xtbl tbody tr:nth-child(even){background:#F8FBFF}

.xtbl td.rnum{background:linear-gradient(180deg,#F1F5F9,#E8EEF5);color:#94A3B8;font-size:10px;font-family:'DM Mono',monospace;text-align:center;font-weight:600;padding:7px 8px;min-width:36px;border-right:2px solid #CBD5E1}
.xtbl td.mono{font-family:'DM Mono',monospace;font-size:11px}
.xtbl td.amt{font-family:'DM Mono',monospace;font-weight:600;color:var(--sky-d)}
.pbar{height:6px;background:var(--sky-l);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .4s;background:linear-gradient(90deg,var(--sky-d),var(--sky))}
.inp{width:100%;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--rs);background:#fff;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border .15s}
.inp:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.1)}
.inp::placeholder{color:var(--t3)}
.inp-lbl{font-size:10.5px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.modal-ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(12,74,110,.35);backdrop-filter:blur(4px)}
.modal-box{background:#fff;border-radius:16px;box-shadow:var(--shm),0 0 0 1px var(--border2);max-height:90vh;overflow-y:auto}
.modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#fff,var(--sky-l))}
.modal-title{font-size:14px;font-weight:800;color:var(--sky-deep)}
.modal-sub{font-size:11px;color:var(--t3);margin-top:2px}
.modal-body{padding:18px 22px}
.tab-bar{display:flex;gap:5px;flex-wrap:wrap}
.tab-btn{padding:5px 13px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:#fff;color:var(--t3);font-family:inherit;transition:all .15s}
.tab-btn.active{background:var(--sky-l);border-color:var(--sky);color:var(--sky-d)}
.tab-btn:hover:not(.active){background:var(--bg)}
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--sky-deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;box-shadow:var(--shm);animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.fadein{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cl-panel{width:300px;min-width:300px;background:#fff;border-left:2px solid var(--sky-m);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.cl-panel-hd{padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#fff,var(--sky-l));flex-shrink:0}
.cl-panel-body{flex:1;overflow-y:auto;padding:12px 14px}
.cl-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;margin-bottom:5px;transition:background .12s}
.cl-item:hover{background:var(--sky-l)}
.cl-item.done-item{background:#F0FDF4;border-color:#BBF7D0}
.row-click{cursor:pointer}
select.inp option{background:white;color:var(--text)}


.bdg-indigo{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
.bdg-sky{background:var(--sky-l);color:var(--sky-d);border-color:var(--sky-m)}


.bdg-indigo{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useRef}=React;
// [업무이력] 기존 업무이력(verify1/verify2/append/history) 연동용 — 기존 배포 그대로 유지
const API_URL="https://script.google.com/macros/s/AKfycbzd8dkOgHBHcsauhB4H2ASU_mdJ9aSAS0IZi66kmwHaXy1QJq3sftoRyPjjxaqZamGjLw/exec";
// [공유 저장] 팀/직원/일정/메모/4대보험/드라이브 등 실시간 공유 저장용 — 새로 배포한 Web App URL
const SHARED_API_URL="https://script.google.com/macros/s/AKfycbyxAxMHGDaEvvPacdsPdHPHMRgYOv7sXdJde0A9eQ3PuNq37t4q6hXRYFPBfM9nIpHv/exec";
const LS_KEY="hr_v15";
const GTMPL_KEY="hr_v15_gtmpl";
const ROUTINE_KEY="hr_v15_routines";
const TODAY=new Date();
const todayStr=TODAY.toISOString().split('T')[0];
const KOR_M=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const MOVE_TYPES=["입사","퇴사","육아휴직","육아기간 단축근로","출산휴가","복직"];
const ALL_STATUSES=["입사","퇴사","복직","육아휴직","출산휴가","육아기간 단축근로"];
const DEPTS=["HQ","PA","MT","MS","EN","CC(EN)","CC(DW)","개발팀"];
const CYCLE_OPTS=["월간","분기별","반기별","연간","일회성"];
const CYCLE_CLR={"월간":"#0EA5E9","분기별":"#8B5CF6","반기별":"#6366F1","연간":"#EC4899","일회성":"#64748B"};
const uid=()=>`id_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;
const fmt=d=>{const dt=d instanceof Date?d:new Date(d);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`};
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const nxtM15=d=>{const r=new Date(d);r.setMonth(r.getMonth()+1,15);return r};
const dday=d=>{const n=Math.ceil((new Date(d)-TODAY)/86400000);return n===0?"D-Day":n>0?`D-${n}`:`D+${Math.abs(n)}`};
const nowIso=()=>new Date().toISOString();

/* ═══════════════════════════════════════════════════════════════════════════
   SheetDB — 구글 스프레드시트(Apps Script Web App) 공유 저장 레이어
   ────────────────────────────────────────────────────────────────────────────
   · boot()            : 앱 시작 시 GET ?action=getState 로 전체 데이터를 한 번에 로드
   · setCollection()   : 변경분을 debounce 후 POST(action:"replace")로 시트에 저장 (optimistic)
   · refresh()         : 다른 사람이 바꾼 내용을 다시 GET 으로 당겨옴 (포커스/주기적 동기화)
   · onStatus()        : 저장/로딩 상태를 구독 → 상단바 동기화 배지·토스트 표시
   localStorage 는 "오프라인 캐시"로만 사용 (시트 연결 실패 시 폴백).
   ═══════════════════════════════════════════════════════════════════════════ */
const SheetDB=(function(){
  const MIRROR="hr_shine_cloud_mirror_v2";
  const STORE={team:null,employees:null,tasks:null,ts:null,routines:null,memos:null,
    gTmpl:null,guide:null,adminName:null,cl:{},ins:{}};
  let ready=false, pending=0, status="idle";
  const listeners=new Set();
  const emit=s=>{status=s;listeners.forEach(fn=>{try{fn(s)}catch(e){}})};
  const readMirror=()=>{try{const s=localStorage.getItem(MIRROR);return s?JSON.parse(s):null}catch{return null}};
  const writeMirror=()=>{try{localStorage.setItem(MIRROR,JSON.stringify(STORE))}catch(e){}};
  function applyState(d){
    if(!d||typeof d!=="object")return;
    ["team","employees","tasks","routines","memos"].forEach(k=>{if(Array.isArray(d[k]))STORE[k]=d[k];});
    ["ts","gTmpl"].forEach(k=>{if(d[k]&&typeof d[k]==="object"&&!Array.isArray(d[k]))STORE[k]=d[k];});
    if(typeof d.guide==="string")STORE.guide=d.guide;
    if(typeof d.adminName==="string"&&d.adminName)STORE.adminName=d.adminName;
    if(d.cl&&typeof d.cl==="object")STORE.cl=d.cl;
    if(d.ins&&typeof d.ins==="object")STORE.ins=d.ins;
  }
  async function boot(){
    emit("loading");
    const mir=readMirror(); if(mir)applyState(mir); // 즉시 오프라인 캐시로 시작
    try{
      const res=await fetch(SHARED_API_URL+"?action=getState&t="+Date.now());
      if(!res.ok)throw new Error("HTTP "+res.status);
      const data=await res.json();
      applyState(data); writeMirror();
      ready=true; emit("saved"); return true;
    }catch(e){
      ready=true; emit(mir?"offline":"error"); return false; // 연결 실패해도 로컬로 동작
    }
  }
  const timers={};
  function schedulePush(payload,key){
    pending++; emit("saving");
    if(timers[key])clearTimeout(timers[key]);
    timers[key]=setTimeout(async()=>{
      try{
        await fetch(SHARED_API_URL,{method:"POST",mode:"no-cors",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify(payload)});
        pending=Math.max(0,pending-1);
        if(pending===0)emit("saved");
      }catch(e){pending=Math.max(0,pending-1);emit("error");}
    },450);
  }
  function setCollection(collection,value){
    if(collection.indexOf("cl:")===0){STORE.cl[collection.slice(3)]=value;}
    else if(collection.indexOf("ins:")===0){const ym=collection.slice(4);if(value===null)delete STORE.ins[ym];else STORE.ins[ym]=value;}
    else {STORE[collection]=value;}
    writeMirror();
    if(!ready)return;            // ⚠ 부트 완료 전에는 절대 push 금지 (빈 데이터로 시트를 덮어쓰는 사고 방지)
    schedulePush({action:"replace",collection,value},collection);
  }
  async function refresh(){
    try{
      const res=await fetch(SHARED_API_URL+"?action=getState&t="+Date.now());
      if(!res.ok)throw new Error();
      const data=await res.json(); applyState(data); writeMirror();
      if(status!=="saving"&&pending===0)emit("saved");
      return data;
    }catch(e){return null;}
  }
  return {boot,refresh,setCollection,
    onStatus:fn=>{listeners.add(fn);fn(status);return()=>listeners.delete(fn);},
    get:k=>STORE[k], getCL:key=>STORE.cl[key], getIns:ym=>STORE.ins[ym],
    isReady:()=>ready, pending:()=>pending, status:()=>status, STORE};
})();

/* 기존 localStorage 헬퍼 → SheetDB 캐시 기반으로 전환 (호출부는 그대로 유지) */
const lsGet=()=>({team:SheetDB.get("team"),employees:SheetDB.get("employees"),
  tasks:SheetDB.get("tasks"),ts:SheetDB.get("ts"),adminName:SheetDB.get("adminName")});
const lsSave=s=>{}; // App 에서 컬렉션별로 SheetDB.setCollection 을 직접 호출하므로 no-op

/* 마운트 직후(=클라우드에서 막 로드한 값)에는 저장을 건너뛰고,
   사용자가 실제로 바꿨을 때만 시트에 push 하기 위한 훅 */
function useSkipFirstEffect(fn,deps){
  const first=useRef(true);
  useEffect(()=>{
    if(first.current){first.current=false;return;}
    return fn();
  },deps);
}
const fmtAmt=v=>{if(v===null||v===undefined||String(v).trim()==="")return"—";const n=Number(String(v).replace(/,/g,"").trim());return isNaN(n)?String(v):n.toLocaleString("ko-KR")};
const fmtCell=v=>{
  if(v===null||v===undefined||String(v).trim()==="")return"—";
  const s=String(v).trim();
  // Detect JS Date toString() format: starts with 3-letter weekday
  if(/^(Sun|Mon|Tue|Wed|Thu|Fri|Sat)\s/.test(s)){
    const d=new Date(s);
    if(!isNaN(d.getTime()))return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  // Detect ISO timestamp like 2026-05-10T00:00:00.000Z
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    return s.slice(0,10);
  }
  return s;
};

function loadGTmpl(){
  const p=SheetDB.get("gTmpl");
  if(p&&typeof p==="object"&&!Array.isArray(p))return p;
  const r={};Object.keys(DEF_SUBS).forEach(k=>{r[k]=DEF_SUBS[k].map(t=>({id:`g_${k.slice(0,3)}_${t.slice(0,8).replace(/\s/g,"_")}`,text:t}))});return r;
}
function saveGTmpl(t){SheetDB.setCollection("gTmpl",t);}
function loadCL(mgr,tgt,tp,gTmpl){
  const k=clKey(mgr,tgt,tp);const gI=(gTmpl&&gTmpl[tp])||[];
  const sv=SheetDB.getCL(k);
  if(Array.isArray(sv)){
    const pers=sv.filter(x=>!x.isGlobal);
    const svGIds=new Set(sv.filter(x=>x.isGlobal).map(x=>x.gid||x.id));
    const newG=gI.filter(g=>!svGIds.has(g.id)).map(g=>({id:uid(),gid:g.id,text:g.text,done:false,isGlobal:true}));
    const syncG=sv.filter(x=>x.isGlobal).map(x=>{const m=gI.find(g=>g.id===(x.gid||x.id));return m?{...x,text:m.text}:null}).filter(Boolean);
    return [...pers,...syncG,...newG];
  }
  const defs=DEF_SUBS[tp]||[];const gTxts=new Set(gI.map(g=>g.text));
  return [...gI.map(g=>({id:uid(),gid:g.id,text:g.text,done:false,isGlobal:true})),...defs.filter(t=>!gTxts.has(t)).map(t=>({id:uid(),text:t,done:false,isGlobal:false}))];
}
function saveCL(mgr,tgt,tp,items){SheetDB.setCollection("cl:"+clKey(mgr,tgt,tp),items);}

function expandRoutine(routine,existing,team){
  const {id:rId,task,cycle,startDate,day,assignees,legal}=routine;
  const start=new Date(startDate||todayStr);
  const horizon=new Date(TODAY);horizon.setMonth(horizon.getMonth()+36);
  const hStart=new Date(TODAY);hStart.setMonth(hStart.getMonth()-24);
  let mi=1;
  if(cycle==="분기별")mi=3;
  else if(cycle==="반기별")mi=6;
  else if(cycle==="연간")mi=12;
  else if(cycle==="일회성")mi=null;
  const exKeys=new Set((existing||[]).filter(t=>t.routineId===rId).map(t=>t.routineKey));
  const res=[];
  const tIds=assignees==="all"?(team||[]).map(m=>m.id):(Array.isArray(assignees)?assignees:[]);
  const addDate=dt=>{
    const due=fmt(dt);
    tIds.forEach(mid=>{
      const k=`${rId}_${due}_${mid}`;
      if(exKeys.has(k))return;
      res.push({id:uid(),task,due,category:cycle,urgent:!!legal,legal:!!legal,asgn:mid,note:cycle+" 정기 일정",empId:null,name:"",dept:"",routineId:rId,routineKey:k,isRoutine:true});
    });
  };
  if(mi===null){
    const d=new Date(start.getFullYear(),start.getMonth(),day||1);
    if(d>=start&&d<=horizon)addDate(d);
  }else{
    const es=new Date(Math.max(start.getTime(),hStart.getTime()));
    let cur=new Date(es.getFullYear(),es.getMonth(),1);
    while(cur<=horizon){
      const dim=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
      const ad=Math.min(day||1,dim);
      const occ=new Date(cur.getFullYear(),cur.getMonth(),ad);
      if(occ>=start&&occ>=hStart&&occ<=horizon)addDate(occ);
      cur.setMonth(cur.getMonth()+mi);
    }
  }
  return res;
}

    </div>
  </div>;
}

// ── BigCal ─────────────────────────────────────────────────────────────────────
function BigCal({tasks,ts,team,calYear,calMonth,onNav,onAddCal,onToggle,onDelete,onEditTask,selectedDate,onSelectDate}){
  const[editTask,setEditTask]=useState(null);
  const[selDay,setSelDay]=useState(()=>{

    return TODAY.getDate();
  });
  const[selAsgn,setSelAsgn]=useState(null);
  const last=new Date(calYear,calMonth+1,0).getDate();
  const startDow=new Date(calYear,calMonth,1).getDay();
  const evMap=useMemo(()=>{
    const m={};(tasks||[]).forEach(t=>{if(!t.due)return;const d=new Date(t.due);if(d.getFullYear()===calYear&&d.getMonth()===calMonth){const k=d.getDate();if(!m[k])m[k]=[];m[k].push(t)}});return m;
  },[tasks,calYear,calMonth]);
  const selEvs=evMap[selDay]||[];
  const asgnList=useMemo(()=>[...new Set(selEvs.map(t=>t.asgn||"미지정"))]  ,[selEvs]);
  useEffect(()=>{if(selAsgn&&!asgnList.includes(selAsgn))setSelAsgn(null)},[asgnList]);
  const rname=id=>{const m=(team||[]).find(x=>x.id===id);return m?m.name:id||"미지정"};
  const days=[];for(let i=0;i<startDow;i++)days.push(null);for(let d=1;d<=last;d++)days.push(d);
  const isTod=d=>d&&calYear===TODAY.getFullYear()&&calMonth===TODAY.getMonth()&&d===TODAY.getDate();
  const isSelDate=d=>d&&selectedDate===fmt(new Date(calYear,calMonth,d));
  return <div style={{display:"flex",gap:12}}>
    <div className="card" style={{flex:1,marginBottom:0}}>
      <div className="card-hd">
        <div className="card-title">
          <div className="card-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1" y="2" width="14" height="12" rx="2" stroke="#0EA5E9" strokeWidth="1.3"/><path d="M5 1v3M11 1v3M1 7h14" stroke="#0EA5E9" strokeWidth="1.2" strokeLinecap="round"/></svg></div>
          {KOR_M[calMonth]+" "+calYear}
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>onNav(-1)}>&#8249;</button>

        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {days.map((d,i)=>{
            const isSel=d&&d===selDay;const isTd=isTod(d);const isSd=isSelDate(d)&&!isSel;const hasEv=d&&(evMap[d]||[]).length>0;
            let cls="cal-cell";if(isSel)cls+=" active";else if(isTd||isSd)cls+=" today";if(hasEv)cls+=" has-ev";
            return <div key={i} className={cls} onClick={()=>{if(!d)return;setSelDay(d);setSelAsgn(null);if(onSelectDate)onSelectDate(fmt(new Date(calYear,calMonth,d)))}}>
              {d&&<span style={{fontSize:11,fontWeight:700,color:isSel?"#fff":isTd?"var(--sky-d)":"var(--t2)"}}>{d}</span>}
              {d&&(evMap[d]||[]).slice(0,2).map((e,j)=><div key={j} style={{fontSize:9,borderRadius:3,padding:"1px 3px",marginTop:2,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis",background:isSel?"rgba(255,255,255,.2)":e.legal?"#FEF2F2":"var(--sky-l)",color:isSel?"#fff":e.legal?"#DC2626":"var(--sky-d)",fontWeight:600}}>{e.task.slice(0,6)}</div>)}
              {d&&(evMap[d]||[]).length>2&&<div style={{fontSize:9,color:"var(--t3)",marginTop:1}}>{"+"+(evMap[d].length-2)}</div>}
            </div>;
          })}
        </div>
      </div>
    </div>
    <div className="card" style={{width:248,flexShrink:0,marginBottom:0,display:"flex",flexDirection:"column"}}>
      <div className="card-hd" style={{flexShrink:0}}>
        <div>
          <div style={{fontSize:12,fontWeight:800,color:"var(--sky-deep)"}}>{calYear+". "+(calMonth+1)+". "+selDay}</div>
          <div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>{asgnList.length+"명 · "+selEvs.length+"개"}</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>onAddCal(fmt(new Date(calYear,calMonth,selDay)))}>+ 추가</button>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)"}}>
          {asgnList.length===0?<div style={{textAlign:"center",padding:"16px 0",color:"var(--t3)",fontSize:11}}>등록된 업무 없음</div>:
          <div>
            <div style={{fontSize:10,fontWeight:700,color:"var(--t3)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:7}}>담당자</div>
            {asgnList.map(a=>{const isA=selAsgn===a;const m=(team||[]).find(x=>x.id===a);const nm=m?m.name:a;const clr=m?m.color:"#0EA5E9";const cnt=selEvs.filter(t=>(t.asgn||"미지정")===a).length;
              return <button key={a} onClick={()=>setSelAsgn(a)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 10px",borderRadius:8,border:"1.5px solid "+(isA?clr:"var(--border2)"),background:isA?clr+"12":"#fff",cursor:"pointer",fontFamily:"inherit",marginBottom:5}}>
                <div style={{display:"flex",alignItems:"center",gap:6}}><Av name={nm} color={clr} size={20}/><span style={{fontSize:11,fontWeight:700,color:isA?clr:"var(--text)"}}>{nm}</span></div>
                <span style={{fontSize:10,color:"var(--t3)"}}>{cnt+"개"}</span>
              </button>;
            })}
          </div>}
        </div>
        <div style={{padding:"10px 14px"}}>
          {!selAsgn?<div style={{fontSize:11,color:"var(--t3)"}}>담당자를 선택하세요</div>:
          <div>
            <div style={{fontSize:11,fontWeight:700,color:"var(--sky-deep)",marginBottom:8}}>{rname(selAsgn)+" To-Do"}</div>
            {selEvs.filter(t=>(t.asgn||"미지정")===selAsgn).map(t=>{
              const isDone=ts[t.id]==="completed";
              return <div key={t.id} style={{padding:"8px 10px",borderRadius:9,border:"1px solid var(--border)",background:isDone?"#F0FDF4":"var(--s2)",marginBottom:6}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
                  <Chk checked={isDone} onChange={()=>onToggle(t.id)} color="#0EA5E9"/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:600,color:isDone?"var(--t3)":"var(--text)",textDecoration:isDone?"line-through":"none"}}>{t.task}</div>
                    <div style={{fontSize:9.5,color:"var(--t3)",marginTop:2}}>{(t.legal?"법정":"일반")+(t.note?" · "+t.note:"")}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:2,flexShrink:0}}>
                    {onEditTask&&<EditBtn onClick={()=>setEditTask(t)}/>}
                    {onDelete&&<DelBtn onClick={()=>{if(confirm("이 업무를 삭제할까요?"))onDelete(t.id)}}/>}
                  </div>
                </div>
              </div>;
            })}
          </div>}
        </div>
      </div>
    </div>
    {editTask&&<TaskEditModal task={editTask} team={team} onSave={patch=>{onEditTask(editTask.id,patch);setEditTask(null)}} onClose={()=>setEditTask(null)}/>}
  </div>;
}

// ── SummaryBar ─────────────────────────────────────────────────────────────────
function SummaryBar({employees,tasks,ts,apiRows,selectedDate,calYear,calMonth}){
  // Dynamic monthly context: use calYear/calMonth for month-specific filtering
  const moStr=calYear+"-"+String(calMonth+1).padStart(2,"0");

  // Monthly joiners/leavers from local employees list (date field, YYYY-MM prefix)
  const empJoiners=(employees||[]).filter(e=>e.type==="입사"&&String(e.date||"").startsWith(moStr)).length;
  const empLeavers=(employees||[]).filter(e=>e.type==="퇴사"&&String(e.date||"").startsWith(moStr)).length;
  // API rows: match 급여반영월 (reflectMonth) against calYear/calMonth,
  // supporting formats: "2026.05", "2026.05 반영", "2026.05반영", "2026-05", "2026/05", "2026년 5월"
  const yr=String(calYear);
  const mo2=String(calMonth+1).padStart(2,"0");  // "05"
  const moNum=String(calMonth+1);               // "5"
  function matchesMonth(rm){
    const s=String(rm||"").trim();
    if(!s)return false;
    // Dot-separated: 2026.05 or 2026.05 반영 or 2026.05반영
    if(s.startsWith(yr+"."+mo2))return true;
    // Dash-separated: 2026-05
    if(s.startsWith(yr+"-"+mo2))return true;
    // Slash-separated: 2026/05
    if(s.startsWith(yr+"/"+mo2))return true;
    // Korean: 2026년 5월 or 2026년 05월
    if(s===yr+"년 "+moNum+"월"||s===yr+"년 "+mo2+"월")return true;
    return false;
  }
  const apiMonthRows=(apiRows||[]).filter(r=>matchesMonth(r.reflectMonth));
  // 구분(isReflected) must be exactly "입사" or "퇴사"
  const apiJoiners=apiMonthRows.filter(r=>String(r.isReflected||"").trim()==="입사").length;
  const apiLeavers=apiMonthRows.filter(r=>String(r.isReflected||"").trim()==="퇴사").length;
  const joiners=empJoiners+apiJoiners;
  const leavers=empLeavers+apiLeavers;

  // Urgency: tasks due within 7 days
  const urgent=(tasks||[]).filter(t=>t.urgent&&ts[t.id]!=="completed");
  const thisWeek=urgent.filter(t=>Math.ceil((new Date(t.due)-TODAY)/86400000)<=7);

  // Daily progress
  const dayTasks=(tasks||[]).filter(t=>t.due===selectedDate);
  const dayDone=dayTasks.filter(t=>ts[t.id]==="completed").length;
  const dayPct=dayTasks.length?Math.round(dayDone/dayTasks.length*100):0;

  // Monthly progress: all tasks whose due date falls within current calendar month
  const monthTasks=(tasks||[]).filter(t=>t.due&&String(t.due).startsWith(moStr));
  const monthDone=monthTasks.filter(t=>ts[t.id]==="completed").length;
  const monthPct=monthTasks.length?Math.round(monthDone/monthTasks.length*100):0;
  const monthLabel=KOR_M[calMonth]+" "+calYear;

  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}>
    <div className="stat-card">
      <div className="stat-label">{monthLabel+" 입퇴사"}</div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{textAlign:"center"}}><div className="stat-value" style={{color:"#1D4ED8",fontSize:20}}>{"+"+joiners}</div><div className="stat-sub">입사</div></div>
        <div style={{width:1,height:32,background:"var(--border2)"}}/>
        <div style={{textAlign:"center"}}><div className="stat-value" style={{color:"#DC2626",fontSize:20}}>{"-"+leavers}</div><div className="stat-sub">퇴사</div></div>
        <div style={{width:1,height:32,background:"var(--border2)"}}/>
        <div style={{textAlign:"center"}}><div className="stat-sub">순증</div><div className="stat-value" style={{color:joiners-leavers>=0?"#16A34A":"#DC2626",fontSize:20}}>{(joiners-leavers>=0?"+":"")+String(joiners-leavers)}</div></div>
      </div>
    </div>
    <div className="stat-card" style={{borderTopColor:thisWeek.length>0?"#EF4444":"var(--sky)"}}>
      <div className="stat-label" style={{color:thisWeek.length>0?"#DC2626":"var(--t3)"}}>긴급 마감</div>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div className="stat-value" style={{color:thisWeek.length>0?"#EF4444":"var(--t3)",fontSize:30}}>{thisWeek.length}</div>
        <div><div className="stat-sub">건 이번 주 마감</div>{thisWeek.slice(0,2).map(t=><div key={t.id} style={{fontSize:10,color:"#DC2626",marginTop:2}}>{dday(t.due)+" · "+t.task}</div>)}</div>
      </div>
    </div>
    <div className="stat-card" style={{borderTopColor:"#8B5CF6"}}>
      <div className="stat-label" style={{color:"#8B5CF6"}}>당일 진행률</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:8,marginBottom:8}}>
        <div className="stat-value" style={{color:"#8B5CF6",fontSize:30}}>{dayPct+"%"}</div>
        <div className="stat-sub" style={{marginBottom:3}}>{dayDone+"/"+dayTasks.length}</div>
      </div>
      <PBar pct={dayPct} color="#8B5CF6" h={6}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:10,color:"var(--t3)"}}>
        <span style={{color:"#8B5CF6",fontWeight:600}}>{selectedDate}</span>
        <span>{"완료 "+dayDone+" / 미완료 "+(dayTasks.length-dayDone)}</span>
      </div>
    </div>
    <div className="stat-card" style={{borderTopColor:"#0EA5E9"}}>
      <div className="stat-label" style={{color:"var(--sky-d)"}}>월 진행률</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:8,marginBottom:8}}>
        <div className="stat-value" style={{color:"var(--sky-d)",fontSize:30}}>{monthPct+"%"}</div>
        <div className="stat-sub" style={{marginBottom:3}}>{monthDone+"/"+monthTasks.length}</div>
      </div>
      <PBar pct={monthPct} h={6}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:10,color:"var(--t3)"}}>
        <span style={{color:"var(--sky-d)",fontWeight:600}}>{monthLabel}</span>
        <span>{"완료 "+monthDone+" / 미완료 "+(monthTasks.length-monthDone)}</span>
      </div>
    </div>
  </div>;
}

          {isSel&&<svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5 4-4" stroke="white" strokeWidth="1.8" strokeLinecap="round"/></svg>}

function ScheduleForm({team,onSubmit,onCancel,initCycle,showCancel}){
  const[task,setTask]=useState("");
  const[cycle,setCycle]=useState(initCycle||"일회성");
  const[startDate,setStartDate]=useState(todayStr);
  const[day,setDay]=useState(15);

  const[assigneeMode,setAssigneeMode]=useState("all");
  const[selMem,setSelMem]=useState([]);
  const[err,setErr]=useState("");
  function submit(){
    if(!task.trim()){setErr("일정명을 입력해주세요.");return;}
    if(assigneeMode==="selected"&&selMem.length===0){setErr("담당자를 1명 이상 선택해주세요.");return;}
    const assignees=assigneeMode==="all"?"all":selMem;

  return <div>
    <FR label="일정명"><input className="inp" placeholder="예: 4대보험 취득신고" value={task} onChange={e=>setTask(e.target.value)}/></FR>

        {CYCLE_OPTS.map(c=><button key={c} onClick={()=>setCycle(c)} style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:"1.5px solid "+(cycle===c?(CYCLE_CLR[c]||"var(--sky)"):"var(--border2)"),background:cycle===c?(CYCLE_CLR[c]||"var(--sky)")+"15":"#fff",color:cycle===c?(CYCLE_CLR[c]||"var(--sky)"):"var(--t3)"}}>{c}</button>)}

      <div style={{fontSize:10,color:"var(--t3)",marginTop:4}}>{"일회성: 1회 / 월간: 매월 / 분기별: 3개월마다 / 반기별: 6개월 / 연간: 매년"}</div>
    </FR>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <FR label={cycle==="일회성"?"날짜":"시작 날짜"}><input type="date" className="inp" value={startDate} onChange={e=>setStartDate(e.target.value)}/></FR>
      {cycle!=="일회성"&&<FR label="매월 몇 일"><input type="number" className="inp" min={1} max={31} value={day} onChange={e=>setDay(e.target.value)}/></FR>}
    </div>
    <FR label="법정 여부">
      <div style={{display:"flex",gap:8}}>
        {[["false","일반"],["true","법정 (긴급)"]].map(([v,l])=><button key={v} onClick={()=>setLegal(v==="true")} style={{padding:"5px 12px",borderRadius:8,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:"1.5px solid "+(String(legal)===v?"#EF4444":"var(--border2)"),background:String(legal)===v?"#FEF2F2":"#fff",color:String(legal)===v?"#EF4444":"var(--t3)"}}>{l}</button>)}
      </div>
    </FR>
    <FR label="담당자 배정"><AssigneePicker team={team} assigneeMode={assigneeMode} setAssigneeMode={setAssigneeMode} selMem={selMem} setSelMem={setSelMem}/></FR>
    {err&&<div style={{fontSize:11,color:"#DC2626",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"8px 12px",marginBottom:8}}>{err}</div>}

function RoutineEditForm({routine,team,onSave,onCancel}){
  const[task,setTask]=useState(routine.task||"");
  const[cycle,setCycle]=useState(routine.cycle||"월간");
  const[day,setDay]=useState(routine.day||15);
  const[startDate,setStartDate]=useState(routine.startDate||todayStr);
  const[legal,setLegal]=useState(!!routine.legal);
  const[assigneeMode,setAssigneeMode]=useState(routine.assignees==="all"?"all":"selected");
  const[selMem,setSelMem]=useState(()=>routine.assignees==="all"?[]:Array.isArray(routine.assignees)?routine.assignees:[]);
  function save(){
    if(!task.trim())return alert("일정명을 입력해주세요.");
    if(assigneeMode==="selected"&&selMem.length===0)return alert("담당자를 1명 이상 선택해주세요.");

  return <div style={{padding:"14px 16px",borderTop:"1px solid var(--border)",background:"#FAFBFF"}}>
    <div style={{fontSize:11,fontWeight:700,color:"var(--sky-deep)",marginBottom:10}}>정기 일정 수정</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>

        <select className="inp" style={{fontSize:11}} value={cycle} onChange={e=>setCycle(e.target.value)}>

      <div><div className="inp-lbl">시작 날짜</div><input type="date" className="inp" style={{fontSize:11}} value={startDate} onChange={e=>setStartDate(e.target.value)}/></div>

    </div>
    <div style={{marginBottom:8}}><div className="inp-lbl">법정 여부</div>
      <div style={{display:"flex",gap:6}}>
        {[["false","일반"],["true","법정"]].map(([v,l])=><button key={v} onClick={()=>setLegal(v==="true")} style={{padding:"4px 10px",borderRadius:7,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:"inherit",border:"1.5px solid "+(String(legal)===v?"#EF4444":"var(--border2)"),background:String(legal)===v?"#FEF2F2":"#fff",color:String(legal)===v?"#EF4444":"var(--t3)"}}>{l}</button>)}
      </div>
    </div>
    <div style={{marginBottom:10}}><div className="inp-lbl">담당자 배정</div>
      <AssigneePicker team={team} assigneeMode={assigneeMode} setAssigneeMode={setAssigneeMode} selMem={selMem} setSelMem={setSelMem}/>
    </div>
    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
      <button className="btn btn-ghost btn-sm" onClick={onCancel}>취소</button>
      <button className="btn btn-primary btn-sm" onClick={save}>수정 저장</button>
    </div>
  </div>;
}

function GlobalRoutineModal({mtype,gTmpl,setGTmpl,onClose}){
  const ts2=TYPE_S[mtype]||{clr:"#0EA5E9",cls:"bdg-sky"};
  const gItems=(gTmpl&&gTmpl[mtype])||[];
  const[newText,setNewText]=useState("");
  const[editId,setEditId]=useState(null);
  const[editText,setEditText]=useState("");
  const inputRef=useRef(null);

  function addItem(){
    const t=newText.trim();if(!t)return;
    const upd={...gTmpl,[mtype]:[...gItems,{id:"g_"+Date.now(),text:t}]};
    setGTmpl(upd);saveGTmpl(upd);setNewText("");if(inputRef.current)inputRef.current.focus();
  }
  function startEdit(g){setEditId(g.id);setEditText(g.text)}
  function saveEdit(gid){
    const t=editText.trim();if(!t)return;
    const upd={...gTmpl,[mtype]:gItems.map(g=>g.id===gid?{...g,text:t}:g)};
    setGTmpl(upd);saveGTmpl(upd);setEditId(null);setEditText("");
  }
  function delItem(gid){
    const upd={...gTmpl,[mtype]:gItems.filter(g=>g.id!==gid)};
    setGTmpl(upd);saveGTmpl(upd);
  }

  return <Modal title={mtype+" 공통 루틴 마스터 관리"} sub={"이 유형의 모든 대상자 체크리스트에 자동 적용됩니다"} onClose={onClose} wide={true}>
    <div style={{marginBottom:14,padding:"10px 14px",borderRadius:9,background:ts2.clr+"08",border:"1px solid "+ts2.clr+"30",fontSize:11,color:ts2.clr}}>
      {"현재 "+gItems.length+"개의 공통 루틴 항목이 등록되어 있습니다. 항목을 추가하면 \""+mtype+"\" 모든 대상자의 체크리스트에 즉시 반영됩니다."}
    </div>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      <input ref={inputRef} className="inp" placeholder={"새 공통 루틴 항목 입력 (예: 4대보험 취득 신고)"} value={newText} onChange={e=>setNewText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}/>
      <button className="btn btn-primary" style={{flexShrink:0,padding:"6px 16px"}} onClick={addItem}>추가</button>
    </div>
    {gItems.length===0?<div style={{textAlign:"center",padding:"24px 0",color:"var(--t3)",fontSize:12,borderRadius:10,border:"1px dashed var(--border2)",background:"var(--bg)"}}>
      등록된 공통 루틴 항목이 없습니다. 위 입력창으로 추가해보세요.
    </div>:gItems.map((g,i)=><div key={g.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",borderRadius:9,border:"1px solid "+(editId===g.id?ts2.clr:"var(--border)"),background:editId===g.id?ts2.clr+"07":"#fff",marginBottom:6}}>
      <span style={{fontSize:11,fontWeight:600,color:"var(--t3)",minWidth:20,textAlign:"center"}}>{i+1}</span>
      <span style={{fontSize:9,padding:"1px 6px",borderRadius:10,background:ts2.clr,color:"#fff",fontWeight:700,flexShrink:0}}>공통</span>
      {editId===g.id?<>
        <input className="inp" style={{flex:1,fontSize:11,padding:"4px 8px"}} value={editText} onChange={e=>setEditText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveEdit(g.id)} autoFocus/>
        <button className="btn btn-primary btn-sm" onClick={()=>saveEdit(g.id)}>저장</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>setEditId(null)}>취소</button>
      </>:<>
        <span style={{flex:1,fontSize:12,color:"var(--text)"}}>{g.text}</span>
        <button className="btn btn-ghost btn-sm" onClick={()=>startEdit(g)} style={{padding:"3px 10px"}}>수정</button>
        <button onClick={()=>delItem(g.id)} style={{width:24,height:24,borderRadius:6,border:"1px solid #FECACA",background:"#FEF2F2",color:"#EF4444",cursor:"pointer",fontSize:12,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>×</button>
      </>}
    </div>)}
  </Modal>;
}

                      const k=`cl__${mgrName.replace(/\s/g,"_")}__${target.replace(/\s/g,"_")}__${mtype.replace(/\s/g,"_")}`;
                      let items=SheetDB.getCL(k)||[];
                      if(items.length===0)return <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,background:"#F8FAFC",color:"#94A3B8",fontWeight:700}}>미시작</span>;
                      const total=items.length;const done=items.filter(x=>x.done).length;
                      if(done===total)return <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,background:"#F0FDF4",color:"#16A34A",border:"1px solid #BBF7D0",fontWeight:700}}>완료</span>;
                      if(done===0)return <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,background:"#FEF9C3",color:"#92400E",border:"1px solid #FDE68A",fontWeight:700}}>미완료</span>;
                      return <span style={{fontSize:9,padding:"2px 7px",borderRadius:10,background:"#FFF7ED",color:"#C2410C",fontWeight:700}}>{done+"/"+total}</span>;
                    })()}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
      {selRow&&<ChecklistPanel row={selRow} managerName={mgrF==="ALL"?String(selRow.manager||""):mgrF} onClose={()=>{setSelRow(null);setClRefresh(p=>p+1)}} gTmpl={gTmpl} setGTmpl={setGTmpl}/>}
    </div>
    {routineModal&&<GlobalRoutineModal mtype={routineModal} gTmpl={gTmpl} setGTmpl={setGTmpl} onClose={()=>setRoutineModal(null)}/>}
  </div>;
}

// ── PageTeam ───────────────────────────────────────────────────────────────────
function QuickAddModal({member,defaultDate,onSave,onClose}){
  const[task,setTask]=useState("");
  const[due,setDue]=useState(defaultDate||todayStr);
  const[urgent,setUrgent]=useState(false);
  const inpRef=useRef(null);
  useEffect(()=>{if(inpRef.current)inpRef.current.focus()},[]);
  function handleSave(){if(!task.trim())return;onSave(task,due,urgent);}
  return <div className="modal-ov" onClick={onClose}>
    <div className="modal-box fadein" style={{width:"min(400px,96vw)"}} onClick={e=>e.stopPropagation()}>
      <div className="modal-hd">
        <div>
          <div className="modal-title" style={{color:member.color}}>{"업무 추가 — "+member.name}</div>
          <div className="modal-sub">{member.role+" · "+due+" 기준"}</div>
        </div>
        <button onClick={onClose} style={{width:28,height:28,borderRadius:8,border:"1px solid var(--border2)",background:"var(--sky-l)",color:"var(--t2)",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>X</button>
      </div>
      <div className="modal-body">
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:10,background:member.color+"10",border:"1px solid "+member.color+"30",marginBottom:14}}>
          <Av name={member.name} color={member.color} size={30}/>
          <div><div style={{fontSize:12,fontWeight:700,color:member.color}}>{member.name}</div><div style={{fontSize:10,color:"var(--t3)"}}>{member.role}</div></div>
        </div>
        <FR label="업무 내용">
          <input ref={inpRef} className="inp" placeholder="예: 4대보험 취득신고 확인" value={task} onChange={e=>setTask(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSave()}/>
        </FR>
        <FR label="마감일">
          <input type="date" className="inp" value={due} onChange={e=>setDue(e.target.value)}/>
        </FR>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <input type="checkbox" id="qa-urgent" checked={urgent} onChange={e=>setUrgent(e.target.checked)} style={{width:14,height:14,accentColor:member.color,cursor:"pointer"}}/>
          <label htmlFor="qa-urgent" style={{fontSize:11,color:"var(--t2)",cursor:"pointer",fontWeight:600}}>긴급 업무로 지정</label>
        </div>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <button className="btn btn-ghost" onClick={onClose}>취소</button>
          <button className="btn btn-primary" onClick={handleSave} style={{background:member.color,borderColor:member.color}}>업무 추가</button>
        </div>
      </div>
    </div>
  </div>;
}

function PageTeam({tasks,ts,team,onToggle,onDelete,onEditTask,onUpdateTeam,selectedDate,onSelectDate}){
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({name:"",role:"",color:"#0EA5E9"});
  const[showWeekly,setShowWeekly]=useState(false);
  const[quickAdd,setQuickAdd]=useState(null); // {member} — inline quick-add form
  const[editTask,setEditTask]=useState(null); // 업무 수정 대상
  const[copied,setCopied]=useState(false);
  const[reportBase,setReportBase]=useState(selectedDate);

  // Reset reportBase to selectedDate each time the modal opens
  function openWeekly(){setReportBase(selectedDate);setShowWeekly(true)}

  function prevDay(){const d=new Date(selectedDate);d.setDate(d.getDate()-1);onSelectDate(fmt(d))}
  function nextDay(){const d=new Date(selectedDate);d.setDate(d.getDate()+1);onSelectDate(fmt(d))}

  // Shift report week by N weeks (positive = future, negative = past)
  function shiftReportWeek(weeks){
    const d=new Date(reportBase);d.setDate(d.getDate()+weeks*7);setReportBase(fmt(d));
  }

  // Weekly range helpers — derived from modal's reportBase, not selectedDate
  function getWeekRange(dateStr){
    const d=new Date(dateStr);
    const dow=d.getDay();
    const diffMon=dow===0?-6:1-dow;
    const mon=new Date(d);mon.setDate(d.getDate()+diffMon);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    return{start:fmt(mon),end:fmt(sun)};
  }
  const reportWeekRange=getWeekRange(reportBase);
  const reportNextStart=new Date(reportWeekRange.end);reportNextStart.setDate(reportNextStart.getDate()+1);
  const reportNextEnd=new Date(reportNextStart);reportNextEnd.setDate(reportNextStart.getDate()+6);
  const reportNextWeekRange={start:fmt(reportNextStart),end:fmt(reportNextEnd)};

  // Check if current reportWeekRange is the "actual" current week for labeling
  const todayWeekRange=getWeekRange(todayStr);
  const isCurrentWeek=reportWeekRange.start===todayWeekRange.start;
  const weekOffset=(()=>{
    const diffMs=new Date(reportWeekRange.start)-new Date(todayWeekRange.start);
    return Math.round(diffMs/(7*86400000));
  })();
  const weekLabel=isCurrentWeek?"이번 주":weekOffset<0?Math.abs(weekOffset)+"주 전":weekOffset+"주 후";

  function inRange(due,range){return due>=range.start&&due<=range.end}

  // Weekly summary — ALL tasks in range, regardless of completion status
  const weeklySummary=useMemo(()=>{
    return (team||[]).map(m=>{
      const mt=(tasks||[]).filter(t=>t.asgn===m.id);
      const thisWeekTasks=mt.filter(t=>inRange(t.due,reportWeekRange));
      const nextWeekTasks=mt.filter(t=>inRange(t.due,reportNextWeekRange));
      return{...m,thisWeekTasks,nextWeekTasks};
    });
  },[tasks,ts,team,reportBase]);

  function buildReportText(){
    const lines=[];
    lines.push(`[주간 보고 요약 — ${weekLabel}]`);
    lines.push(`대상 주: ${reportWeekRange.start} ~ ${reportWeekRange.end}`);
    lines.push(`다음 주: ${reportNextWeekRange.start} ~ ${reportNextWeekRange.end}`);
    lines.push("");
    weeklySummary.forEach(m=>{
      if(m.thisWeekTasks.length===0&&m.nextWeekTasks.length===0)return;
      lines.push(`■ ${m.name} (${m.role})`);
      lines.push(`  ▶ 이번 주 일정 (${m.thisWeekTasks.length}건)`);
      if(m.thisWeekTasks.length===0)lines.push("    - 없음");
      else m.thisWeekTasks.forEach(t=>lines.push(`    - [${t.due}] ${t.task} ${ts[t.id]==="completed"?"[완료]":"[미완료]"}`));
      lines.push(`  ▷ 다음 주 일정 (${m.nextWeekTasks.length}건)`);
      if(m.nextWeekTasks.length===0)lines.push("    - 없음");
      else m.nextWeekTasks.forEach(t=>lines.push(`    - [${t.due}] ${t.task} ${ts[t.id]==="completed"?"[완료]":"[미완료]"}`));
      lines.push("");
    });
    return lines.join("\n");
  }

  function handleCopy(){
    const text=buildReportText();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)});
    }else{
      const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");setCopied(true);setTimeout(()=>setCopied(false),2000)}catch(e){}
      document.body.removeChild(ta);
    }
  }

  const dayStats=(team||[]).map(m=>{const mt=(tasks||[]).filter(t=>t.asgn===m.id&&t.due===selectedDate);const done=mt.filter(t=>ts[t.id]==="completed").length;const pct=mt.length?Math.round(done/mt.length*100):0;return{...m,dayTotal:mt.length,dayDone:done,dayPct:pct,dayTasks:mt}});
  const allDayTasks=(tasks||[]).filter(t=>t.due===selectedDate);
  const allDayDone=allDayTasks.filter(t=>ts[t.id]==="completed").length;
  const allDayPct=allDayTasks.length?Math.round(allDayDone/allDayTasks.length*100):0;
  function openAdd(){setForm({name:"",role:"",color:"#0EA5E9"});setModal("add")}
  function openEdit(m){setForm({name:m.name,role:m.role,color:m.color});setModal(m)}
  function save(){if(!form.name.trim())return;if(modal==="add")onUpdateTeam([...(team||[]),{id:"T"+Date.now(),...form}]);else onUpdateTeam((team||[]).map(m=>m.id===modal.id?{...m,...form}:m));setModal(null)}
  function remove(id){if(confirm("팀원을 삭제할까요?"))onUpdateTeam((team||[]).filter(m=>m.id!==id))}

  function scrollToMember(memberId){
    const el=document.getElementById("member-card-"+memberId);
    if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  }

  function handleQuickSave(task,due){
    if(!task.trim()||!quickAdd)return;
    const m=quickAdd.member;
    const newTask={id:uid(),empId:null,name:"",dept:"",task:task.trim(),due,category:"일회성",urgent:false,legal:false,asgn:m.id,note:"",isRoutine:false};
    if(typeof window.__addTask==="function")window.__addTask(newTask);
    setQuickAdd(null);
  }

  return <div className="fadein">
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,background:"#fff",border:"1px solid var(--border2)",borderRadius:"var(--r)",padding:"12px 18px",boxShadow:"var(--sh)"}}>
      <div style={{flex:1,display:"flex",alignItems:"center",gap:8}}>
        <button className="btn btn-ghost btn-sm" onClick={prevDay} style={{padding:"5px 10px",fontWeight:700}}>&#8249; 이전</button>
        <input type="date" value={selectedDate} onChange={e=>onSelectDate(e.target.value)} style={{fontSize:12,padding:"5px 10px",border:"1.5px solid var(--border2)",borderRadius:"var(--rs)",background:"#fff",color:"var(--text)",fontFamily:"inherit",outline:"none"}}/>
        <button className="btn btn-ghost btn-sm" onClick={nextDay} style={{padding:"5px 10px",fontWeight:700}}>다음 &#8250;</button>
        <button className="btn btn-ghost btn-sm" onClick={()=>onSelectDate(todayStr)} style={{padding:"5px 10px",color:"var(--sky-d)"}}>오늘</button>
      </div>
      <button className="btn btn-secondary" style={{fontSize:11,padding:"5px 13px"}} onClick={openWeekly}>주간 보고 요약</button>
      <button className="btn btn-primary" onClick={openAdd}>+ 팀원 추가</button>
    </div>

    <div style={{marginBottom:14,background:"#fff",border:"1px solid var(--border2)",borderRadius:"var(--r)",padding:"14px 18px",boxShadow:"var(--sh)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:12,fontWeight:700,color:"#8B5CF6"}}>{selectedDate+" 당일 진행률"}</div>
        <div style={{fontSize:22,fontWeight:800,color:"#8B5CF6"}}>{allDayPct+"% "}<span style={{fontSize:12,fontWeight:500,color:"var(--t3)"}}>{allDayDone+"/"+allDayTasks.length+"개"}</span></div>
      </div>
      <PBar pct={allDayPct} color="#8B5CF6" h={7}/>
      {allDayTasks.length===0&&<div style={{fontSize:11,color:"var(--t3)",marginTop:6}}>이 날짜에 배정된 일정이 없습니다.</div>}
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:10,marginBottom:14}}>
      {(team||[]).map((m,idx)=>{const d=dayStats[idx];
        return <div key={m.id} className="card" style={{padding:"16px 18px",borderTop:"3px solid "+m.color}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <Av name={m.name} color={m.color} size={34}/>
            <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>scrollToMember(m.id)} title={m.name+" 업무 목록으로 이동"}>
              <div style={{fontSize:13,fontWeight:700,color:m.color,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.name}</div>
              <div style={{fontSize:10,color:"var(--t3)"}}>{m.role}</div>
            </div>
            <div style={{display:"flex",gap:4}}>
              <button className="btn btn-ghost" style={{padding:"3px 8px",fontSize:10}} onClick={()=>openEdit(m)}>수정</button>
              <button className="btn btn-danger" style={{padding:"3px 8px",fontSize:10}} onClick={()=>remove(m.id)}>삭제</button>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:6}}>
            <span style={{fontSize:24,fontWeight:800,color:m.color,letterSpacing:"-.04em"}}>{d.dayPct+"%"}</span>
            <span style={{fontSize:10,color:"var(--t3)"}}>{d.dayDone+"/"+d.dayTotal}</span>
          </div>
          <PBar pct={d.dayPct} color={m.color} h={5}/>
          <div style={{fontSize:10,color:"var(--t3)",marginTop:5}}>{d.dayDone+"/"+d.dayTotal+" 완료 · 당일"}</div>
        </div>;
      })}
    </div>

    {(team||[]).map((m,idx)=>{const d=dayStats[idx];
      return <div key={m.id} id={"member-card-"+m.id} className="card">
        <div className="card-hd">
          <div className="card-title" style={{color:m.color}}><Av name={m.name} color={m.color} size={24}/>{m.name+" · "+m.role}<span style={{fontSize:10,fontWeight:500,color:"var(--t3)",marginLeft:6}}>{selectedDate}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <button onClick={()=>setQuickAdd({member:m})} title={""+m.name+"에게 업무 추가"} style={{padding:"3px 10px",borderRadius:7,border:"1.5px solid "+m.color+"50",background:m.color+"10",color:m.color,cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit",display:"flex",alignItems:"center",gap:4}}>
              <span style={{fontSize:14}}>+</span>업무 추가
            </button>
            <span style={{fontSize:12,fontWeight:800,color:m.color}}>{d.dayPct+"% "}<span style={{fontSize:10,fontWeight:500,color:"var(--t3)"}}>{d.dayDone+"/"+d.dayTotal}</span></span>
          </div>
        </div>
        <div className="card-body">
          {d.dayTasks.length>0?d.dayTasks.map(t=>{const isDone=ts[t.id]==="completed";
            return <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid var(--border)"}}>
              <Chk checked={isDone} onChange={()=>onToggle(t.id)} color={m.color}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                  {t.isRoutine&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:10,background:(CYCLE_CLR[t.category]||"#64748B")+"15",color:CYCLE_CLR[t.category]||"#64748B",fontWeight:700,flexShrink:0}}>{t.category}</span>}
                  {t.urgent&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:10,background:"#FEF2F2",color:"#DC2626",border:"1px solid #FECACA",fontWeight:700,flexShrink:0}}>긴급</span>}
                  <span style={{fontSize:12,color:isDone?"var(--t3)":"var(--text)",textDecoration:isDone?"line-through":"none"}}>{t.task}</span>
                </div>
                <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{t.due+" · "+dday(t.due)}</div>
              </div>
              <EditBtn onClick={()=>setEditTask(t)}/>
              <DelBtn onClick={()=>{if(confirm("이 업무를 삭제할까요?"))onDelete(t.id)}}/>
            </div>;
          }):<div style={{fontSize:12,color:"var(--t3)",padding:"12px 0",textAlign:"center"}}>{selectedDate+"에 배정된 일정 없음"}</div>}
        </div>
      </div>;
    })}

    {quickAdd&&<QuickAddModal member={quickAdd.member} defaultDate={selectedDate} onSave={handleQuickSave} onClose={()=>setQuickAdd(null)}/>}
    {editTask&&<TaskEditModal task={editTask} team={team} onSave={patch=>{onEditTask(editTask.id,patch);setEditTask(null)}} onClose={()=>setEditTask(null)}/>}
    {modal&&modal!=="weekly"&&<Modal title={modal==="add"?"팀원 추가":"팀원 수정"} onClose={()=>setModal(null)}>
      <FR label="이름 (한국어)"><input className="inp" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="박혜연"/></FR>
      <FR label="역할"><input className="inp" value={form.role} onChange={e=>setForm(f=>({...f,role:e.target.value}))} placeholder="HR 매니저"/></FR>
      <FR label="컬러"><div style={{display:"flex",alignItems:"center",gap:8}}><input type="color" value={form.color} onChange={e=>setForm(f=>({...f,color:e.target.value}))} style={{width:36,height:36,border:"1px solid var(--border2)",borderRadius:8,cursor:"pointer",padding:3}}/><span style={{fontSize:12,fontFamily:"'DM Mono',monospace"}}>{form.color}</span></div></FR>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}>
        <button className="btn btn-ghost" onClick={()=>setModal(null)}>취소</button>
        <button className="btn btn-primary" onClick={save}>저장</button>
      </div>
    </Modal>}

    {showWeekly&&<div className="modal-ov" onClick={()=>setShowWeekly(false)}>
      <div className="modal-box fadein" style={{width:"min(720px,96vw)",maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
        <div className="modal-hd">
          <div>
            <div className="modal-title">{"주간 보고 요약 — "+weekLabel}</div>
            <div className="modal-sub">{reportWeekRange.start+" ~ "+reportWeekRange.end}</div>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <button className="btn btn-secondary btn-sm" onClick={handleCopy} style={{minWidth:80}}>{copied?"복사됨!":"텍스트 복사"}</button>
            <button onClick={()=>setShowWeekly(false)} style={{width:28,height:28,borderRadius:8,border:"1px solid var(--border2)",background:"var(--sky-l)",color:"var(--t2)",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>X</button>
          </div>
        </div>
        <div style={{padding:"10px 22px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg)"}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>shiftReportWeek(-1)} style={{fontWeight:700}}>&#8249; 이전 주</button>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:12,fontWeight:700,color:"var(--sky-deep)"}}>{weekLabel}</div>
            <div style={{fontSize:10,color:"var(--t3)"}}>{reportWeekRange.start+" ~ "+reportWeekRange.end}</div>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>shiftReportWeek(1)} style={{fontWeight:700}}>다음 주 &#8250;</button>
        </div>
        <div style={{padding:"16px 22px",overflowY:"auto",maxHeight:"calc(90vh - 130px)"}}>
          {weeklySummary.map(m=><div key={m.id} style={{marginBottom:18,borderRadius:12,border:"1px solid "+m.color+"30",overflow:"hidden"}}>
            <div style={{padding:"10px 14px",background:m.color+"10",display:"flex",alignItems:"center",gap:8,borderBottom:"1px solid "+m.color+"20"}}>
              <Av name={m.name} color={m.color} size={26}/>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:800,color:m.color}}>{m.name}</div>
                <div style={{fontSize:10,color:"var(--t3)"}}>{m.role}</div>
              </div>
              <div style={{fontSize:10,color:"var(--t3)"}}>{"이번 주 "+m.thisWeekTasks.length+"건 / 다음 주 "+m.nextWeekTasks.length+"건"}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}}>
              <div style={{padding:"12px 14px",borderRight:"1px solid var(--border)"}}>
                <div style={{fontSize:10,fontWeight:700,color:"#16A34A",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8,display:"flex",alignItems:"center",gap:5}}>
                  <span style={{width:6,height:6,borderRadius:"50%",background:"#16A34A",display:"inline-block"}}/>
                  {weekLabel+" 일정 ("+m.thisWeekTasks.length+"건)"}
                </div>
                {m.thisWeekTasks.length===0?<div style={{fontSize:11,color:"var(--t3)"}}>일정 없음</div>:
                  m.thisWeekTasks.map(t=>{const done=ts[t.id]==="completed";return <div key={t.id} style={{display:"flex",alignItems:"flex-start",gap:6,marginBottom:5}}>
                    <span style={{width:5,height:5,borderRadius:"50%",background:done?"#16A34A":"#CBD5E1",flexShrink:0,marginTop:5}}/>
                    <div><div style={{fontSize:11,color:done?"var(--t3)":"var(--text)",fontWeight:500,textDecoration:done?"line-through":"none"}}>{t.task}</div><div style={{fontSize:9.5,color:"var(--t3)",display:"flex",gap:6}}><span>{t.due}</span><span style={{color:done?"#16A34A":"#F59E0B",fontWeight:700}}>{done?"[완료]":"[미완료]"}</span></div></div>
                  </div>;})
                }
              </div>
              <div style={{padding:"12px 14px"}}>
                <div style={{fontSize:10,fontWeight:700,color:"var(--sky-d)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:8,display:"flex",alignItems:"center",gap:5}}>
                  <span style={{width:6,height:6,borderRadius:"50%",background:"var(--sky-d)",display:"inline-block"}}/>
                  {"다음 주 일정 ("+m.nextWeekTasks.length+"건)"}
                </div>
                {m.nextWeekTasks.length===0?<div style={{fontSize:11,color:"var(--t3)"}}>일정 없음</div>:
                  m.nextWeekTasks.map(t=>{const done=ts[t.id]==="completed";return <div key={t.id} style={{display:"flex",alignItems:"flex-start",gap:6,marginBottom:5}}>
                    <span style={{width:5,height:5,borderRadius:"50%",background:done?"#16A34A":"var(--sky-d)",flexShrink:0,marginTop:5}}/>
                    <div><div style={{fontSize:11,color:done?"var(--t3)":"var(--text)",fontWeight:500,textDecoration:done?"line-through":"none"}}>{t.task}</div><div style={{fontSize:9.5,color:"var(--t3)",display:"flex",gap:6}}><span>{t.due}</span><span style={{color:done?"#16A34A":"#F59E0B",fontWeight:700}}>{done?"[완료]":"[미완료]"}</span></div></div>
                  </div>;})
                }
              </div>
            </div>
          </div>)}
          {weeklySummary.length===0&&<div style={{textAlign:"center",padding:"32px 0",color:"var(--t3)"}}>팀원 데이터가 없습니다.</div>}
        </div>
      </div>
    </div>}
  </div>;
}


// ── PageHistory ────────────────────────────────────────────────────────────────
function PageHistory({adminName,setAdminName,apiRows,setApiRows,apiStatus,setApiStatus,apiUrl,setApiUrl}){
  const[vLoad,setVLoad]=useState({});
  const[showUrlEdit,setShowUrlEdit]=useState(false);
  const[fMonth,setFMonth]=useState("ALL");const[fMgr,setFMgr]=useState("ALL");const[fRefl,setFRefl]=useState("ALL");
  const[showAdd,setShowAdd]=useState(false);
  const EMPTY={reflectMonth:"",writer:"",manager:"",isReflected:"",department:"",employeeId:"",targetName:"",content:"",amount:"",etc:""};
  const[newRow,setNewRow]=useState({...EMPTY});const[addLoading,setAddLoading]=useState(false);
  function fetchData(url){
    setApiStatus("loading");
    fetch(url||apiUrl).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(data=>{
      const rows=Array.isArray(data)?data:(data.data||[]);
      setApiRows(rows.map((r,i)=>({rowIndex:r.rowIndex||(i+2),...r})));
      setApiStatus("ok");
    }).catch(()=>setApiStatus("err"));
  }
  useEffect(()=>{if(apiStatus==="idle")fetchData()},[]);
  const months=useMemo(()=>[...new Set((apiRows||[]).map(r=>String(r.reflectMonth||"").trim()).filter(Boolean))].sort(),[apiRows]);
  const managers=useMemo(()=>[...new Set((apiRows||[]).map(r=>String(r.manager||"").trim()).filter(Boolean))].sort(),[apiRows]);
  const reflOpts=useMemo(()=>[...new Set((apiRows||[]).map(r=>String(r.isReflected||"").trim()).filter(Boolean))].sort(),[apiRows]);
  const filtered=useMemo(()=>(apiRows||[]).filter(r=>{
    if(fMonth!=="ALL"&&String(r.reflectMonth||"").trim()!==fMonth)return false;
    if(fMgr!=="ALL"&&String(r.manager||"").trim()!==fMgr)return false;
    if(fRefl!=="ALL"&&String(r.isReflected||"").trim()!==fRefl)return false;
    return true;
  }),[apiRows,fMonth,fMgr,fRefl]);
  async function postAction(body){return fetch(apiUrl,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})}
  async function toggleV1(row){
    const k="v1_"+row.rowIndex;setVLoad(p=>({...p,[k]:true}));
    // C열(manager) 이름을 1차 검증자로 사용
    const v1Name=String(row.manager||adminName||"담당자").trim();
    const v1Label=v1Name+" 확인 완료";
    setApiRows(prev=>prev.map(r=>{
      if(r.rowIndex!==row.rowIndex)return r;
      if(!r.verify1Done)return{...r,verify1Done:true,verify1By:v1Label,verify1At:nowIso().slice(0,16).replace("T"," ")};
      return{...r,verify1Done:false,verify1By:"",verify1At:"",verify2Done:false,verify2By:"",verify2At:""};
    }));
    try{await postAction({action:"verify1",rowIndex:row.rowIndex,verifyBy:v1Label})}catch(e){}
    setVLoad(p=>({...p,[k]:false}));
  }
  async function toggleV2(row){
    if(!row.verify1Done)return;const k="v2_"+row.rowIndex;setVLoad(p=>({...p,[k]:true}));
    // 2차 검증은 항상 파트장 "박혜연" 명의로 고정
    const V2_NAME="박혜연 확인 완료";
    setApiRows(prev=>prev.map(r=>{
      if(r.rowIndex!==row.rowIndex)return r;
      if(!r.verify2Done)return{...r,verify2Done:true,verify2By:V2_NAME,verify2At:nowIso().slice(0,16).replace("T"," ")};
      return{...r,verify2Done:false,verify2By:"",verify2At:""};
    }));
    try{await postAction({action:"verify2",rowIndex:row.rowIndex,verifyBy:V2_NAME})}catch(e){}
    setVLoad(p=>({...p,[k]:false}));
  }
  async function submitNewRow(){
    if(!newRow.targetName||!newRow.reflectMonth)return alert("급여반영월과 대상자는 필수입니다.");
    setAddLoading(true);
    try{await postAction({action:"append",...newRow});setApiRows(prev=>[...prev,{...newRow,rowIndex:prev.length+2,verify1Done:false,verify1By:"",verify1At:"",verify2Done:false,verify2By:"",verify2At:""}]);setNewRow({...EMPTY});setShowAdd(false);}
    catch(e){alert("제출 실패: "+e.message)}
    setAddLoading(false);
  }
  function downloadHistoryExcel(){

  const DATA_COLS=[{key:"reflectMonth",label:"급여반영월",letter:"A",mw:90},{key:"writer",label:"작성자",letter:"B",mw:70},{key:"manager",label:"담당자",letter:"C",mw:80},{key:"isReflected",label:"반영/구분",letter:"D",mw:100,badge:true},{key:"department",label:"사업부",letter:"E",mw:70},{key:"employeeId",label:"사번",letter:"F",mw:80,mono:true},{key:"targetName",label:"대상자",letter:"G",mw:80},{key:"content",label:"내용",letter:"H",mw:150},{key:"amount",label:"금액",letter:"I",mw:90,amount:true},{key:"etc",label:"기타",letter:"J",mw:80}];

      <div style={{width:7,height:7,borderRadius:"50%",background:"currentColor",flexShrink:0,animation:apiStatus==="loading"?"pulse 1s infinite":"none"}}/>
      <span style={{fontWeight:600}}>{apiStatus==="loading"?"로딩 중...":apiStatus==="ok"?("연결 완료 — 총 "+(apiRows||[]).length+"건 · 1차완료 "+v1done+"건 · 2차완료 "+v2done+"건"):apiStatus==="err"?"API 연결 실패":"API 대기 중"}</span>
      <div style={{flex:1}}/>
      <button className="btn btn-ghost btn-sm" onClick={()=>setShowUrlEdit(p=>!p)}>URL 설정</button>
      <button className="btn btn-secondary btn-sm" onClick={()=>fetchData()}>새로고침</button>
    </div>
    {showUrlEdit&&<div style={{padding:"12px 16px",borderRadius:9,border:"1px solid var(--sky-m)",background:"var(--sky-l)",marginBottom:12,display:"flex",gap:8,alignItems:"flex-end"}}>
      <div style={{flex:1}}><div className="inp-lbl">Google Apps Script 배포 URL</div><input className="inp" style={{fontSize:11}} value={apiUrl} onChange={e=>setApiUrl(e.target.value)}/></div>
      <button className="btn btn-primary" onClick={()=>{fetchData(apiUrl);setShowUrlEdit(false)}}>저장 + 불러오기</button>
    </div>}
    <div className="card">
      <div className="card-hd">
        <div className="card-title"><div className="card-icon"><svg width="14" height="14" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="16" height="16" rx="2" fill="#34A853"/><path d="M5 7h10M5 10h10M5 13h6" stroke="white" strokeWidth="1.5" strokeLinecap="round"/></svg></div>급여 특이사항 — Google Sheets 연동</div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:5,background:"var(--sky-l)",border:"1px solid var(--sky-m)",borderRadius:8,padding:"4px 10px"}}>

            <input value={adminName} onChange={e=>setAdminName(e.target.value)} placeholder="박혜연" style={{fontSize:11,outline:"none",width:68,background:"transparent",color:"var(--text)",fontFamily:"inherit",border:"none"}}/>
          </div>
          <button className="btn btn-secondary btn-sm" onClick={downloadHistoryExcel}
            style={{fontSize:10,display:"inline-flex",alignItems:"center",gap:4}}>
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 2v7M7 9l-3-3M7 9l3-3M2 12h10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            엑셀 다운로드

          <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(p=>!p)}>{showAdd?"X 닫기":"+ 신규 제출"}</button>

        <button className="btn btn-ghost btn-sm" onClick={()=>{setFMonth("ALL");setFMgr("ALL");setFRefl("ALL")}}>초기화</button>

            </thead>

              {filtered.length===0?<tr><td colSpan={DATA_COLS.length+3} style={{textAlign:"center",padding:30,color:"var(--t3)",fontSize:12}}>{apiStatus==="loading"?"로딩 중...":apiStatus==="err"?"API 연결 실패":"데이터 없음"}</td></tr>:
              filtered.map((row,ri)=>{
                const v1=!!row.verify1Done,v2=!!row.verify2Done;const v1k="v1_"+row.rowIndex,v2k="v2_"+row.rowIndex;
                return <tr key={ri} className={v2?"row-v2":""}  style={{background:isMR(row)?"rgba(14,165,233,.03)":"transparent"}}>

                    :c.amount?<span style={{fontFamily:"'DM Mono',monospace",fontWeight:700,color:"var(--sky-d)"}}>{fmtAmt(row[c.key])}</span>

                          {v2&&<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5 4-4" stroke="white" strokeWidth="1.8" strokeLinecap="round"/></svg>}
                        </button>

                      {!v1&&!v2&&<div style={{fontSize:9.5,color:"#CBD5E1",paddingLeft:22}}>1차 완료 후 가능</div>}
                    </div>
                  </td>
                </tr>;
              })}
            </tbody>
          </table>

      </div>
    </div>

}

// ── PageMemo — 특이사항 관리 ─────────────────────────────────────────────────
const MEMO_LS_KEY="hr_shine_memos_v1";
const MEMO_CATS=["일반 메모","노무/법적 이슈","임직원 요청","시스템 에러","제도 변경"];
const CAT_CLR={"일반 메모":"#64748B","노무/법적 이슈":"#DC2626","임직원 요청":"#0EA5E9","시스템 에러":"#D97706","제도 변경":"#8B5CF6"};

function loadMemos(){const m=SheetDB.get("memos");return Array.isArray(m)?m:[];}
function saveMemos(m){SheetDB.setCollection("memos",m||[]);}

function PageMemo({selectedDate,cloudRev}){
  const[memos,setMemos]=useState(()=>loadMemos());
  const[author,setAuthor]=useState("");
  const[cat,setCat]=useState(MEMO_CATS[0]);
  const[date,setDate]=useState(selectedDate||todayStr);
  const[content,setContent]=useState("");
  const[remark,setRemark]=useState("");
  const[err,setErr]=useState("");
  const[filterCat,setFilterCat]=useState("ALL");
  const[filterDate,setFilterDate]=useState("");
  const fromCloud=useRef(false); // 클라우드发 갱신은 재저장(push) 안 함

  useEffect(()=>{setDate(selectedDate||todayStr)},[selectedDate]);
  useSkipFirstEffect(()=>{ if(fromCloud.current){fromCloud.current=false;return;} saveMemos(memos)},[memos]);
  // 다른 사용자가 추가/삭제한 메모를 제자리 갱신 (cloudRev 신호 — 30초 주기/포커스/수동)
  useSkipFirstEffect(()=>{
    const fresh=loadMemos();
    setMemos(prev=>{ if(JSON.stringify(prev)===JSON.stringify(fresh))return prev; fromCloud.current=true; return fresh; });
  },[cloudRev]);

  function addMemo(){
    if(!author.trim()){setErr("작성자를 입력해주세요.");return;}
    if(!content.trim()){setErr("업무 내용을 입력해주세요.");return;}
    const m={id:uid(),author:author.trim(),cat,date,content:content.trim(),remark:remark.trim(),createdAt:nowIso()};
    setMemos(p=>[m,...(p||[])]);
    setContent("");setRemark("");setErr("");
  }
  function delMemo(id){if(confirm("이 메모를 삭제할까요?"))setMemos(p=>(p||[]).filter(m=>m.id!==id))}

  const filtered=(memos||[]).filter(m=>{
    if(filterCat!=="ALL"&&m.cat!==filterCat)return false;
    if(filterDate&&m.date!==filterDate)return false;
    return true;
  });

  const TH={background:"var(--sky-d)",borderRight:"1px solid rgba(255,255,255,.15)",padding:"7px 10px",fontSize:10,fontWeight:700,color:"#fff",whiteSpace:"nowrap",textAlign:"left"};

  function downloadMemoExcel(){
    const headers=["작성자","카테고리","일자","업무 내용","비고","등록일시"];
    const data=[headers];
    (memos||[]).forEach(m=>{
      data.push([m.author||"",m.cat||"",m.date||"",m.content||"",m.remark||"",String(m.createdAt||"").slice(0,16).replace("T"," ")]);
    });
    const ws=XLSX.utils.aoa_to_sheet(data);
    // Auto-width approximation
    const colWidths=[{wch:12},{wch:18},{wch:12},{wch:50},{wch:25},{wch:18}];
    ws["!cols"]=colWidths;

// ── Google Drive 연동 (GAS 경유) ────────────────────────────────────────────
const GAS_DRIVE_URL = SHARED_API_URL; // 4대보험 원본 파일 업로드는 공유 저장용 Web App(SHARED_API_URL)을 통해 처리

async function driveUploadFile(file, curYM) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const base64 = e.target.result.split(",")[1];
        const res = await fetch(GAS_DRIVE_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "uploadFile",
            fileName: file.name,
            base64Data: base64,
            mimeType: file.type || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            subFolderName: curYM,
          }),
        });
        // no-cors returns opaque response; assume success if no error thrown
        resolve({ ok: true, fileName: file.name });
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function driveFetchFileList(curYM) {
  try {
    const res = await fetch(GAS_DRIVE_URL + "?action=listFiles&subFolderName=" + encodeURIComponent(curYM));
    if (!res.ok) return [];
    const data = await res.json();
    return data.files || [];
  } catch {
    return [];
  }
}
